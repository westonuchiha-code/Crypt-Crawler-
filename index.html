function nextLevel() {
  level++;
  P.hp = Math.min(P.maxHp, P.hp + 25);
  generate(level);
  const z = ZONES[zoneOf(level)];
  if (level === zoneStart(level)) {
    P.hp = P.maxHp; saveCheckpoint();
    showMsg(level === 1 ? `You step into the Spire · ${z.name}` : `${z.name} · checkpoint`);
  } else showMsg(level % 10 === 0 ? `Floor ${level} · ${z.boss} awaits` : `Floor ${level}`);
}
function continueGame(cp) {
  kills = cp.kills || 0;
  P = newPlayer(); Object.assign(P.owned, cp.owned); Object.assign(P.ammo, cp.ammo);
  P.weapon = P.owned[cp.weapon] ? cp.weapon : 'fist';
  level = cp.floor; generate(level);
  running = true; overlay.style.display = 'none';
  showMsg(`${ZONES[zoneOf(level)].name} · floor ${level}`);
}
function giveWeapon(w) {
  const had = P.owned[w];
  P.owned[w] = true; P.ammo[w] += CRATE_AMMO[w];
  if (!had) P.weapon = w;
  showMsg(had ? `${WEAPONS[w].name}: +${CRATE_AMMO[w]} ${AMMO_NAME[w]}` : `Found the ${WEAPONS[w].name}!`);
}
function pickupItem(kind) {
  if (kind === 'potion') {
    P.hp = Math.min(P.maxHp, P.hp + 35);
    showMsg('Healing draught +35 HP');
  } else if (kind === 'ammo') {
    for (const w in BOX_AMMO) P.ammo[w] += BOX_AMMO[w];
    showMsg('Ammo box');
  } else if (kind === 'drop') {                       // small ammo dropped by an enemy, for a random gun you can use on this floor
    const pool = Object.keys(WEAPON_FLOOR).filter(w => level >= WEAPON_FLOOR[w]);
    const w = pool[(Math.random() * pool.length) | 0];
    const n = Math.max(1, Math.round(BOX_AMMO[w] / 2));
    P.ammo[w] += n; showMsg(`+${n} ${AMMO_NAME[w]}`);
  } else if (kind === 'crate') {
    // prefer a gun you do not have; otherwise any unlocked one (refill)
    const pool = Object.keys(WEAPON_FLOOR).filter(w => Math.max(1, level) >= WEAPON_FLOOR[w]);
    const missing = pool.filter(w => !P.owned[w]);
    const from = missing.length ? missing : pool;
    giveWeapon(from[(Math.random() * from.length) | 0]);
  }
}
// called after a shot: an empty gun leaves the cycle and you switch to the next one you have (fists at worst)
function dropIfEmpty(w) {
  if (!WEAPONS[w].ammo || P.ammo[w] > 0) return;
  P.owned[w] = false;
  const next = WEAPON_ORDER.find(o => P.owned[o]) || 'fist';
  P.weapon = next; P.owned.fist = true;
  showMsg(`${WEAPONS[w].name} is empty`);
}
function cycleWeapon() {
  const owned = WEAPON_ORDER.filter(w => P.owned[w]);
  const i = owned.indexOf(P.weapon);
  P.weapon = owned[(i + 1) % owned.length];
  showMsg(WEAPONS[P.weapon].name);
}

// knock shoves the enemy away from (fx, fy) (default: the player); stun freezes it briefly. Bosses mostly shrug both off.
function hurtMonster(m, dmg, knock = 0, stun = 0, fx = P.x, fy = P.y) {
  m.hp -= dmg; m.hurt = 0.15;
  if (knock) {
    const ex = m.x - fx, ey = m.y - fy, d = Math.hypot(ex, ey) || 1, k = knock * (m.boss ? 0.2 : 1) * 6;
    m.kbx = (m.kbx || 0) + ex / d * k; m.kby = (m.kby || 0) + ey / d * k;
  }
  if (stun) m.stun = Math.max(m.stun || 0, stun * (m.boss ? 0.3 : 1));
  if (m.hp <= 0) {
    m.dead = true; kills++;
    // enemies sometimes drop a little ammo; bosses always leave a weapon crate and an ammo box
    if (m.boss) { items.push({ x: m.x, y: m.y, kind: 'crate', taken: false }, { x: m.x + 0.3, y: m.y, kind: 'ammo', taken: false }); }
    else if (Math.random() < 0.3) items.push({ x: m.x, y: m.y, kind: 'drop', taken: false });
    if (m.boss) {
      if (level >= FINAL) pendingWin = 1.5;
      else showMsg(`${m.name} falls! The stairs unseal.`);
    } else showMsg('Slain!');
  }
}
function hitscan(ang, w) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let best = null, bestAlong = Infinity;
  for (const m of monsters) {
    if (m.dead) continue;
    const ex = m.x - P.x, ey = m.y - P.y;
    const along = ex * dx + ey * dy;
    if (along <= 0.2) continue;
    const perp = Math.abs(ex * dy - ey * dx);
    const reach = (m.boss ? 0.5 : 0.18) + along * 0.08;
    if (perp > reach) continue;
    if (along < bestAlong && los(P.x, P.y, m.x, m.y)) { best = m; bestAlong = along; }
  }
  if (best) {
    // shotgun pellets lose power with distance (full inside w.near, 25% at w.far)
    const fall = w.near ? Math.max(0.25, Math.min(1, 1 - (bestAlong - w.near) / (w.far - w.near) * 0.75)) : 1;
    hurtMonster(best, Math.round(roll(w.dmg) * fall), (w.knock || 0) * fall, w.stun || 0);
  }
}
function fire() {
  if (!running || P.fire > 0) return;
  const w = WEAPONS[P.weapon];
  if (w.ammo && P.ammo[P.weapon] <= 0) { P.fire = 0.3; dropIfEmpty(P.weapon); return; }
  const used = P.weapon;
  if (w.ammo) P.ammo[used]--;
  P.fire = w.cool; P.anim = 1; P.animRate = 1 / (w.animDur || 0.4);
  if (w.type === 'hitscan') {
    P.flash = 0.09;
    for (let i = 0; i < w.pellets; i++) hitscan(P.a + (w.spread ? rnd(-w.spread, w.spread) : 0), w);
  } else if (w.type === 'melee') { P.swingT = 0; if (meleeHit(w) > 0) P.hitFlash = 0.15; }
  else if (w.type === 'chain') chainLightning(w);
  else spawnPlayerShot(w);
  dropIfEmpty(used);
}

function spawnShot(m) {
  const d = Math.hypot(P.x - m.x, P.y - m.y) || 1;
  const sp = m.boss ? 4.2 : 3.2;
  m.atk = 0.35;
  shots.push({ x: m.x, y: m.y, vx: (P.x - m.x) / d * sp, vy: (P.y - m.y) / d * sp, life: 4, dmg: Math.round((m.boss ? 10 : 4) * dmgMul(level)) });
}
function updateShots(dt) {
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (solid(s.x, s.y)) { s.life = -1; continue; }
    if (Math.hypot(s.x - P.x, s.y - P.y) < 0.4) { s.life = -1; hurtPlayer(s.dmg); }
  }
  shots = shots.filter(s => s.life > 0);
}
// ---------- player melee & projectiles ----------
function inCone(m, range, arc) {
  const ex = m.x - P.x, ey = m.y - P.y;
  if (Math.hypot(ex, ey) > range) return false;
  let diff = Math.atan2(ey, ex) - P.a;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  return Math.abs(diff) <= arc && los(P.x, P.y, m.x, m.y);
}
function meleeHit(w) {
  let n = 0;
  for (const m of monsters) {
    if (!m.dead && inCone(m, w.range, w.arc)) { hurtMonster(m, roll(w.dmg), w.knock, w.stun); n++; }
  }
  return n;
}
function spawnPlayerShot(w) {
  // shots leave from the weapon (a little right of the eye) and converge on the crosshair 5 cells ahead
  const dx = Math.cos(P.a), dy = Math.sin(P.a);
  const sx = P.x + dx * 0.4, sy = P.y + dy * 0.4;
  const aimX = P.x + dx * 5 - sx, aimY = P.y + dy * 5 - sy, al = Math.hypot(aimX, aimY);
  pshots.push({ kind: w.type === 'arrow' ? 'arrow' : 'magic', x: sx, y: sy,
    vx: aimX / al * w.speed, vy: aimY / al * w.speed, life: 1.6, dmg: w.dmg, blast: w.blast || 0, blastDmg: w.blastDmg || 0, knock: w.knock || 0, dead: false });
}
function explode(s) {
  s.dead = true;
  if (s.blast > 0) {
    pshots.push({ kind: 'boom', x: s.x, y: s.y, vx: 0, vy: 0, life: 0.25, static: true, dead: false });
    for (const m of monsters) {
      if (!m.dead && Math.hypot(m.x - s.x, m.y - s.y) < s.blast) hurtMonster(m, roll(s.blastDmg), s.knock, 0.2, s.x, s.y);
    }
  }
}
function updatePlayerShots(dt) {
  for (const s of pshots) {
    if (s.dead) continue;
    if (s.static) { s.life -= dt; if (s.life <= 0) s.dead = true; continue; }
    s.life -= dt;
    const steps = 4;
    for (let k = 0; k < steps && !s.dead; k++) {
      s.x += s.vx * dt / steps; s.y += s.vy * dt / steps;
      if (solid(s.x, s.y)) { explode(s); break; }
      for (const m of monsters) {
        if (!m.dead && Math.hypot(m.x - s.x, m.y - s.y) < 0.35) {
          hurtMonster(m, roll(s.dmg));
          explode(s);
          break;
        }
      }
    }
    if (!s.dead && s.life <= 0) s.dead = true;
  }
  pshots = pshots.filter(s => !s.dead);
}

// lightning: the first bolt hits the nearest enemy in front, then arcs to nearby enemies
function chainLightning(w) {
  let first = null, bd = Infinity;
  for (const m of monsters) {
    if (m.dead || !inCone(m, w.range, w.arc)) continue;
    const d = Math.hypot(m.x - P.x, m.y - P.y);
    if (d < bd) { bd = d; first = m; }
  }
  if (!first) {
    // no target: a short spark out in front
    bolts.push({ hand: true, ax: 0, ay: 0, bx: P.x + Math.cos(P.a) * 3, by: P.y + Math.sin(P.a) * 3, life: 0.12 });
    return;
  }
  const hit = new Set();
  let cur = first, from = { x: P.x + Math.cos(P.a) * 0.5, y: P.y + Math.sin(P.a) * 0.5 };
  for (let j = 0; j < w.jumps && cur; j++) {
    hit.add(cur);
    bolts.push({ hand: j === 0, ax: from.x, ay: from.y, bx: cur.x, by: cur.y, life: 0.2 });
    hurtMonster(cur, Math.round(roll(w.dmg) * Math.pow(w.falloff, j)), 0, w.stun);
    from = { x: cur.x, y: cur.y };
    let next = null, nd = Infinity;
    for (const m of monsters) {
      if (m.dead || hit.has(m)) continue;
      const d = Math.hypot(m.x - cur.x, m.y - cur.y);
      if (d < w.chain && d < nd && los(cur.x, cur.y, m.x, m.y)) { nd = d; next = m; }
    }
    cur = next;
  }
}
// project a world point to screen-x (returns null if behind the camera)
function projectX(x, y) {
  const dirX = Math.cos(P.a), dirY = Math.sin(P.a);
  const planeX = -dirY * FOV_PLANE, planeY = dirX * FOV_PLANE;
  const inv = 1 / (planeX * dirY - dirX * planeY);
  const sx = x - P.x, sy = y - P.y;
  const tx = inv * (dirY * sx - dirX * sy);
  const ty = inv * (-planeY * sx + planeX * sy);
  return ty > 0.2 ? RW / 2 * (1 + tx / ty) : null;
}
// draw one jagged bolt between two screen points: blue glow, white core, impact flash
function drawJaggedBolt(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;                 // perpendicular: jitter across the bolt, not along it
  const amp = Math.min(9, len * 0.1);
  const pts = [[x1, y1]];
  for (let i = 1; i < 10; i++) {
    const t = i / 10, off = rnd(-1, 1) * amp;
    pts.push([x1 + dx * t + nx * off, y1 + dy * t + ny * off]);
  }
  pts.push([x2, y2]);
  const stroke = (col, lw) => {
    bctx.strokeStyle = col; bctx.lineWidth = lw;
    bctx.beginPath(); bctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) bctx.lineTo(pts[i][0], pts[i][1]);
    bctx.stroke();
  };
  stroke('rgba(80,160,255,0.45)', 3);
  stroke('#f4fbff', 1);
  bctx.fillStyle = 'rgba(190,225,255,0.7)';
  bctx.beginPath(); bctx.arc(x2, y2, 2.5, 0, Math.PI * 2); bctx.fill();
}
function drawBolts() {
  for (const b of bolts) {
    const y2 = RH / 2;
    const x2 = projectX(b.bx, b.by);
    if (x2 === null) continue;
    let x1, y1;
    if (b.hand) { [x1, y1] = palmPoint(P.anim); }   // from the casting hand's fingertips
    else {
      x1 = projectX(b.ax, b.ay);
      if (x1 === null) continue;
      y1 = y2;
    }
    drawJaggedBolt(x1, y1, x2, y2);
  }
  bctx.lineWidth = 1;
}

// Crossbow bolts, drawn along their line of flight: the steel head leads toward the target,
// the red fletching trails behind. Each bolt is projected at two points on its path, so the
// shaft points where it is actually going. Bolts fly a little below eye level and rise toward
// the horizon as they recede, so they arc toward the enemy in front.
function drawArrowShots() {
  const dirX = Math.cos(P.a), dirY = Math.sin(P.a);
  const planeX = -dirY * FOV_PLANE, planeY = dirX * FOV_PLANE;
  const inv = 1 / (planeX * dirY - dirX * planeY);
  const project = (x, y) => {
    const sx = x - P.x, sy = y - P.y;
    const tx = inv * (dirY * sx - dirX * sy), ty = inv * (-planeY * sx + planeX * sy);
    if (ty <= 0.2) return null;
    return { x: RW / 2 * (1 + tx / ty), y: RH / 2 + RH * 0.09 / ty, d: ty };
  };
  for (const s of pshots) {
    if (s.kind !== 'arrow' || s.dead) continue;
    const sp = Math.hypot(s.vx, s.vy) || 1;
    const ux = s.vx / sp, uy = s.vy / sp;
    const head = project(s.x, s.y);
    const tail = project(s.x - ux * 0.8, s.y - uy * 0.8);
    if (!head || !tail) continue;
    if (head.d >= zBuf[Math.max(0, Math.min(RW - 1, Math.round(head.x)))]) continue;   // behind a wall
    // direction on screen, from tail to head
    const ex = head.x - tail.x, ey = head.y - tail.y;
    const elen = Math.hypot(ex, ey) || 1;
    const dx = ex / elen, dy = ey / elen;
    const px = -dy, py = dx;                          // perpendicular
    const size = Math.max(1.5, Math.min(7, 9 / head.d));   // bolts shrink with distance
    // shaft
    bctx.strokeStyle = '#c8a878'; bctx.lineWidth = Math.max(1, size * 0.4);
    bctx.beginPath(); bctx.moveTo(tail.x, tail.y); bctx.lineTo(head.x, head.y); bctx.stroke();
    // steel head at the front, pointing where the bolt is going
    const bx = head.x - dx * size, by = head.y - dy * size;
    bctx.fillStyle = '#d8d8e0';
    bctx.beginPath();
    bctx.moveTo(head.x + dx * size * 0.4, head.y + dy * size * 0.4);
    bctx.lineTo(bx + px * size * 0.6, by + py * size * 0.6);
    bctx.lineTo(bx - px * size * 0.6, by - py * size * 0.6);
    bctx.closePath(); bctx.fill();
    // red fletching at the back
    const fl = size * 1.2;
    bctx.fillStyle = '#d33';
    bctx.beginPath();
    bctx.moveTo(tail.x, tail.y);
    bctx.lineTo(tail.x - dx * fl + px * fl, tail.y - dy * fl + py * fl);
    bctx.lineTo(tail.x - dx * fl * 0.4, tail.y - dy * fl * 0.4);
    bctx.lineTo(tail.x - dx * fl - px * fl, tail.y - dy * fl - py * fl);
    bctx.closePath(); bctx.fill();
  }
  bctx.lineWidth = 1;
}

function updateMonsters(dt) {
  for (const m of monsters) {
    if (m.dead) continue;
    m.hurt -= dt; m.mcool -= dt; m.rcool -= dt; m.atk = (m.atk || 0) - dt;
    if (m.kbx || m.kby) {                                   // knockback slides out over ~0.2 s
      moveEnt(m, m.kbx * dt, m.kby * dt);
      const decay = Math.max(0, 1 - 9 * dt); m.kbx *= decay; m.kby *= decay;
      if (Math.abs(m.kbx) + Math.abs(m.kby) < 0.05) m.kbx = m.kby = 0;
    }
    if (m.stun > 0) { m.stun -= dt; continue; }             // stunned: no moving or attacking
    const ex = P.x - m.x, ey = P.y - m.y, d = Math.hypot(ex, ey);
    const spd = (0.85 + 0.04 * zoneOf(level) + 0.01 * ((level - 1) % 10)) * m.speed * dt;
    if (d < 11 && los(m.x, m.y, P.x, P.y)) {
      if (m.ranged && m.rcool <= 0 && d > 2.2) {
        m.rcool = m.boss ? 1.5 : 2.6;
        spawnShot(m);
      }
      if (d > (m.boss ? 1.3 : 0.9)) moveEnt(m, ex / d * spd, ey / d * spd);
      if (d <= (m.boss ? 1.6 : 1.0) && m.mcool <= 0) { m.mcool = 1.0; m.atk = 0.35; hurtPlayer(m.dmg); }
    } else {
      m.wander -= dt;
      if (m.wander <= 0) { m.wander = rnd(1, 3); m.wa = rnd(0, Math.PI * 2); }
      moveEnt(m, Math.cos(m.wa) * spd * 0.4, Math.sin(m.wa) * spd * 0.4);
    }
  }
}

// ---- movement feel ----
// Sticks are analog with a dead zone and a response curve; speed and turning ease in and out instead of snapping.
const MOVE_SPEED = 3.0, MOVE_ACCEL = 14, MOVE_DECEL = 18;   // cells/s, and how fast velocity catches up
const TURN_SPEED = 3.0, TURN_ACCEL = 16;                    // rad/s at full tilt
const DEAD = 0.12;
const stickCurve = v => { const a = Math.abs(v); if (a < DEAD) return 0; const t = (a - DEAD) / (1 - DEAD); return Math.sign(v) * t * t * 0.4 + Math.sign(v) * t * 0.6; };
function update(dt) {
  // turning: keys or right stick, curved so small tilts aim finely, smoothed so it ramps rather than jerks
  const look = RQPad.state.look.x || 0;
  const turnIn = Math.abs(look) > DEAD ? stickCurve(look) : (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  P.turnV = (P.turnV || 0) + (turnIn * TURN_SPEED - (P.turnV || 0)) * Math.min(1, TURN_ACCEL * dt);
  P.a += P.turnV * dt;
  const dx = Math.cos(P.a), dy = Math.sin(P.a);
  const rx = -dy, ry = dx;

  // moving: when the left stick is held, use it alone (the pad also presses WASD past ~35% tilt; mixing them
  // made it snap to full speed). Keyboard keeps full-speed digital input.
  let f, s;
  const jx = touchState.joyX, jy = touchState.joyY, jm = Math.hypot(jx, jy);
  if (jm > DEAD) {
    const k = stickCurve(Math.min(1, jm)) / jm;          // analog: tilt sets speed, direction stays exact
    f = -jy * k; s = jx * k;
  } else {
    f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const l = Math.hypot(f, s); if (l > 1) { f /= l; s /= l; }
  }
  const tvx = (dx * f + rx * s) * MOVE_SPEED, tvy = (dy * f + ry * s) * MOVE_SPEED;
  const rate = (f || s ? MOVE_ACCEL : MOVE_DECEL) * dt;
  P.vx = (P.vx || 0) + (tvx - (P.vx || 0)) * Math.min(1, rate);
  P.vy = (P.vy || 0) + (tvy - (P.vy || 0)) * Math.min(1, rate);
  if (Math.abs(P.vx) + Math.abs(P.vy) > 0.001) {
    const ox = P.x, oy = P.y;
    moveEnt(P, P.vx * dt, P.vy * dt);
    if (P.x === ox) P.vx *= 0.5;     // bumping a wall bleeds that axis instead of storing speed against it
    if (P.y === oy) P.vy *= 0.5;
  }

  P.fire -= dt; P.flash -= dt; P.hurt -= dt; msgT -= dt; sealMsgT -= dt;
  P.anim = Math.max(0, P.anim - dt * (P.animRate || 2.5));
  P.swingT += dt;
  P.hitFlash = Math.max(0, P.hitFlash - dt);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  if (msgT <= 0) msgEl.style.opacity = 0;
  if (keys.Space) fire();

  updateMonsters(dt);
  updateShots(dt);
  updatePlayerShots(dt);
  if (pendingWin > 0) { pendingWin -= dt; if (pendingWin <= 0) { victory(); return; } }
  if (!running) return;

  for (const it of items) {
    if (!it.taken && Math.hypot(it.x - P.x, it.y - P.y) < 0.55) { it.taken = true; pickupItem(it.kind); }
  }
  items = items.filter(i => !i.taken);

  if (level === 0) {
    if (Math.hypot(P.x - 3.5, P.y - 1.5) < 1.1) { nextLevel(); return; }
  } else if (map[Math.floor(P.y) * W + Math.floor(P.x)] === STAIRS && level < FINAL) {
    if (!bossAlive()) { nextLevel(); return; }
    if (sealMsgT <= 0) { showMsg('Sealed until the guardian falls'); sealMsgT = 3; }
  }

  if (level > 0) {
    const cx = Math.floor(P.x), cy = Math.floor(P.y);
    for (let yy = cy - 4; yy <= cy + 4; yy++) for (let xx = cx - 4; xx <= cx + 4; xx++) {
      if (xx >= 0 && yy >= 0 && xx < W && yy < H && Math.hypot(xx - P.x, yy - P.y) <= 4.2)
        explored[yy * W + xx] = 1;
    }
  }

  hpfill.style.width = (P.hp / P.maxHp * 100) + '%';
  const wdef = WEAPONS[P.weapon];
  const ammoTxt = wdef.ammo ? P.ammo[P.weapon] : '∞';
  const b = monsters.find(m => m.boss && !m.dead);
  const floorTxt = level === 0 ? 'ENTRANCE' : `FLOOR ${level} · ${ZONES[zoneOf(level)].name.replace('THE ', '')}`;
  stats.textContent = `${floorTxt} · ${wdef.name} ${ammoTxt} · SLAIN ${kills}${b ? ` · ${b.name} ${b.hp}/${b.maxHp}` : ''}`;
}

// ---------- rendering ----------
const FLOOR_A = [84, 74, 64], FLOOR_B = [66, 58, 50], CEIL_A = [40, 36, 52], CEIL_B = [30, 27, 40], STAIR_C = [70, 140, 255];
function rgbf(c, f) { return (255 << 24) | ((c[2] * f) << 16) | ((c[1] * f) << 8) | (c[0] * f); }
function sh(c, f) {
  const r = Math.min(255, (c & 255) * f);
  const g = Math.min(255, ((c >>> 8) & 255) * f);
  const b = Math.min(255, ((c >>> 16) & 255) * f);
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

const skyCol = new Int32Array(RW);
function renderFloorCeil(dirX, dirY, planeX, planeY) {
  const rdx0 = dirX - planeX, rdy0 = dirY - planeY, rdx1 = dirX + planeX, rdy1 = dirY + planeY;
  const pulse = 0.8 + 0.2 * Math.sin(performance.now() / 300);
  if (SKY_PX) for (let x = 0; x < RW; x++) {
    const ang = P.a + Math.atan((2 * x / RW - 1) * FOV_PLANE);
    skyCol[x] = ((((ang / (Math.PI * 2)) * SKY_W) % SKY_W + SKY_W) % SKY_W) | 0;
  }
  for (let y = 0; y < RH; y++) {
    const p = y - RH / 2;
    const isFloor = p > 0;
    const rowDist = (RH / 2) / Math.max(Math.abs(p), 0.5);
    const stepX = rowDist * (rdx1 - rdx0) / RW, stepY = rowDist * (rdy1 - rdy0) / RW;
    let wx = P.x + rowDist * rdx0, wy = P.y + rowDist * rdy0;
    const fog = Math.max(0, 1 - rowDist / 10);
    const row = y * RW;
    for (let x = 0; x < RW; x++) {
      const cx = Math.floor(wx), cy = Math.floor(wy);
      const inside = cx >= 0 && cy >= 0 && cx < W && cy < H;
      const t = inside ? map[cy * W + cx] : 1;
      const chk = (cx + cy) & 1;
      let c, k = fog;
      if (isFloor) {
        if (t === STAIRS) {
          // stair treads running across the cell, with dark nosing lines
          c = chk ? [96, 90, 80] : [84, 78, 70];   // plain stone; the flight itself is the sprite
        }
        else if (FLOOR_TEX) { pix[row + x] = sh(FLOOR_TEX[(((wy - cy) * 64) & 63) * 64 + (((wx - cx) * 64) & 63)], k); wx += stepX; wy += stepY; continue; }
        else c = chk ? FLOOR_A : FLOOR_B;
      } else if (SKY_PX) {   // open sky: sample the panorama by ray angle (skyCol) and screen row, no fog
        pix[row + x] = SKY_PX[Math.min(SKY_H - 1, (y * SKY_H / (RH / 2)) | 0) * SKY_W + skyCol[x]]; wx += stepX; wy += stepY; continue;
      } else if (CEIL_TEX) { pix[row + x] = sh(CEIL_TEX[(((wy - cy) * 64) & 63) * 64 + (((wx - cx) * 64) & 63)], k * 0.75); wx += stepX; wy += stepY; continue; }
      else {
        c = chk ? CEIL_A : CEIL_B;
      }
      pix[row + x] = rgbf(c, Math.min(1, k));
      wx += stepX; wy += stepY;
    }
  }
}

function renderWalls(dirX, dirY, planeX, planeY) {
  for (let x = 0; x < RW; x++) {
    const camX = 2 * x / RW - 1;
    const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
    let mx = Math.floor(P.x), my = Math.floor(P.y);
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let sx, sy, sdx, sdy;
    if (rdx < 0) { sx = -1; sdx = (P.x - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - P.x) * ddx; }
    if (rdy < 0) { sy = -1; sdy = (P.y - my) * ddy; } else { sy = 1; sdy = (my + 1 - P.y) * ddy; }

    let side = 0, tile = 0;
    for (;;) {
      if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; }
      else { sdy += ddy; my += sy; side = 1; }
      tile = (mx >= 0 && my >= 0 && mx < W && my < H) ? map[my * W + mx] : 1;
      if (tile > 0 && tile !== STAIRS) break;
    }

    const perp = side === 0 ? (mx - P.x + (1 - sx) / 2) / rdx : (my - P.y + (1 - sy) / 2) / rdy;
    zBuf[x] = perp;

    const lineH = RH / perp;
    const rawStart = RH / 2 - lineH / 2;
    const y0 = Math.max(0, Math.floor(rawStart));
    const y1 = Math.min(RH - 1, Math.floor(RH / 2 + lineH / 2));

    let wallX = side === 0 ? P.y + perp * rdy : P.x + perp * rdx;
    wallX -= Math.floor(wallX);
    let texX = Math.floor(wallX * 64);
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) texX = 63 - texX;

    const tex = WALLS[tile];
    const step = 64 / lineH;
    let texPos = (y0 - rawStart) * step;
    const f = Math.max(0.04, 1 - perp / 12) * (side ? 0.66 : 1);
    for (let y = y0; y <= y1; y++) {
      const ty = Math.floor(texPos) & 63;
      texPos += step;
      pix[y * RW + x] = sh(tex[ty * 64 + texX], f);
    }
  }
}

function renderSprites(dirX, dirY, planeX, planeY) {
  const list = [];
  for (const m of monsters) if (m.dead) continue; else {
    const art = MON_PX[m.boss ? 'boss' + (zoneOf(level) + 1) : m.kind];   // boss1 ... boss10, one per zone
    if (art) {   // photo-rendered sprite: feet on the floor, attack frame, mirrored steps and a small hop while walking
      const ph = (m.x + m.y) * 2.2;
      list.push({ x: m.x, y: m.y, tex: art.frames[m.atk > 0 ? 1 : 0], hurt: m.hurt > 0, mon: true,
        // attack = lunge: swells ~12% and lurches up (no arm animation; posed arms looked broken)
        hW: MON_H * (m.boss ? 2.1 : m.scale) * art.tall * (m.atk > 0 ? 1.12 : 1), flip: m.atk <= 0 && (Math.floor(ph) & 1),
        hop: m.atk > 0 ? 0.06 : Math.abs(Math.sin(ph * Math.PI)) * 0.025 });
    } else list.push({ x: m.x, y: m.y, tex: m.tex, hurt: m.hurt > 0, v: m.boss ? 0.05 : 0.12, scale: m.scale });
  }
  for (const it of items) if (!it.taken) list.push({ x: it.x, y: it.y, tex: SPR[it.kind === 'drop' ? 'ammo' : it.kind], hurt: false, v: it.kind === 'drop' ? 0.38 : 0.3, scale: it.kind === 'drop' ? 0.5 : 0.8 });
  for (const s of shots) list.push({ x: s.x, y: s.y, tex: SPR.fire, hurt: false, v: 0, scale: 0.5 });
  for (const s of pshots) {
    if (s.kind === 'arrow') continue;                // bolts are drawn along their flight path by drawArrowShots()
    const tex = s.kind === 'boom' ? SPR.fire : SPR.magic;
    list.push({ x: s.x, y: s.y, tex, hurt: false, v: 0, scale: s.kind === 'boom' ? 1.6 : 0.7, minD: s.kind === 'magic' ? 0.9 : 0.2 });
  }
  if (stairsPos && level > 0) list.push({ x: stairsPos.x, y: stairsPos.y, tex: SPR.stairs, hurt: false, v: 0.15, scale: 1 });
  for (const s of list) s.d = (s.x - P.x) ** 2 + (s.y - P.y) ** 2;
  list.sort((a, b) => b.d - a.d);

  const inv = 1 / (planeX * dirY - dirX * planeY);
  for (const s of list) {
    const sx = s.x - P.x, sy = s.y - P.y;
    const tx = inv * (dirY * sx - dirX * sy);
    const ty = inv * (-planeY * sx + planeX * sy);
    if (ty <= (s.minD || 0.2)) continue;
    if (s.mon) { drawMonsterSprite(s, tx, ty); continue; }
    const size = Math.floor(RH / ty * s.scale);
    if (size <= 0) continue;
    const scrX = Math.floor((RW / 2) * (1 + tx / ty));
    const top = Math.floor(RH / 2 - size / 2 + size * s.v);
    const x0 = Math.floor(scrX - size / 2), x1 = x0 + size;
    const y0 = Math.max(0, top), y1 = Math.min(RH - 1, top + size - 1);
    const fog = Math.max(0.12, 1 - ty / 12) * (s.hurt ? 1.7 : 1);
    for (let x = Math.max(0, x0); x < Math.min(RW, x1); x++) {
      if (ty >= zBuf[x]) continue;
      const tX = Math.floor((x - x0) * 32 / size);
      for (let y = y0; y <= y1; y++) {
        const tY = Math.floor((y - top) * 32 / size);
        const c = s.tex[tY * 32 + tX];
        if ((c >>> 24) < 128) continue;
        pix[y * RW + x] = sh(c, fog);
      }
    }
  }
}

// Tall monster sprite standing on the floor (floor line for distance ty is RH/2 + RH/(2*ty)).
function drawMonsterSprite(s, tx, ty) {
  const t = s.tex, hpx = RH / ty * s.hW, wpx = hpx * t.w / t.h;
  if (hpx < 1) return;
  const scrX = (RW / 2) * (1 + tx / ty);
  const bottom = RH / 2 + RH / (2 * ty) - s.hop * RH / ty;
  const top = bottom - hpx, x0 = scrX - wpx / 2;
  const fog = Math.max(0.12, 1 - ty / 12);
  const ys = Math.max(0, Math.floor(top)), ye = Math.min(RH - 1, Math.floor(bottom));
  for (let x = Math.max(0, Math.floor(x0)); x < Math.min(RW, Math.ceil(x0 + wpx)); x++) {
    if (ty >= zBuf[x]) continue;
    let tX = Math.floor((x - x0) * t.w / wpx); if (tX < 0 || tX >= t.w) continue;
    if (s.flip) tX = t.w - 1 - tX;
    for (let y = ys; y <= ye; y++) {
      const tY = Math.floor((y - top) * t.h / hpx); if (tY < 0 || tY >= t.h) continue;
      const c = t[tY * t.w + tX];
      if ((c >>> 24) < 128) continue;
      pix[y * RW + x] = s.hurt ? sh((c & 0xff00ffff) | 0x30 << 16, fog * 1.8) : sh(c, fog);   // hit: brighter, warmer flash
    }
  }
}

// Sword keyframes, first-person style: idle at the lower right, a windup pulling back,
// a fast horizontal slash across the view, then recovery. Offsets are from the screen bottom-centre.
const SWORD_WIND = 0.12, SWORD_STRIKE = 0.14, SWORD_REC = 0.22, SWORD_L = 40;
const HELD_S = 2.3;                // scale of all held weapons and hands (the low-res buffer makes them look tiny otherwise)
const HAND_X = 52, HAND_Y = -12;   // shared grip point, relative to (screen centre, bottom); matches the sword's approved resting grip
const SWORD_IDLE = { x: 58, y: -36, r: -0.28 };
const SWORD_WINDUP = { x: 78, y: -24, r: 1.2 };
const SWORD_HIT = { x: -30, y: -60, r: -1.45 };
function swordPoseAt(T) {
  const lerpP = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, r: p.r + (q.r - p.r) * t });
  const easeOut = t => 1 - Math.pow(1 - t, 3), easeIn = t => t * t * t;
  if (T < SWORD_WIND) return { pose: lerpP(SWORD_IDLE, SWORD_WINDUP, easeOut(T / SWORD_WIND)), phase: 'wind' };
  T -= SWORD_WIND;
  if (T < SWORD_STRIKE) return { pose: lerpP(SWORD_WINDUP, SWORD_HIT, easeIn(T / SWORD_STRIKE)), phase: 'strike' };
  T -= SWORD_STRIKE;
  if (T < SWORD_REC) return { pose: lerpP(SWORD_HIT, SWORD_IDLE, easeOut(T / SWORD_REC)), phase: 'rec' };
  return { pose: SWORD_IDLE, phase: 'idle' };
}
function swordTip(pose, cx, base) {
  const px = cx + pose.x, py = base + pose.y;
  return [px + Math.sin(pose.r) * SWORD_L * HELD_S, py - Math.cos(pose.r) * SWORD_L * HELD_S];
}
function drawSword(cx, base) {
  const { pose, phase } = swordPoseAt(P.swingT);
  // slash trail: where the tip has been during the strike
  if (phase === 'strike') {
    const N = 8;
    for (let i = 1; i <= N; i++) {
      const ta = Math.max(0, P.swingT - (N - i + 1) * 0.02), tb = Math.max(0, P.swingT - (N - i) * 0.02);
      const [x0, y0] = swordTip(swordPoseAt(ta).pose, cx, base);
      const [x1, y1] = swordTip(swordPoseAt(tb).pose, cx, base);
      bctx.strokeStyle = `rgba(230,240,255,${0.1 + 0.5 * i / N})`;
      bctx.lineWidth = 2;
      bctx.beginPath(); bctx.moveTo(x0, y0); bctx.lineTo(x1, y1); bctx.stroke();
    }
    bctx.lineWidth = 1;
  }
  bctx.save();
  bctx.translate(cx + pose.x, base + pose.y);
  bctx.rotate(pose.r);
  bctx.scale(HELD_S, HELD_S);
  // blade: tapered, lit edge on the left, shadow edge on the right
  bctx.fillStyle = '#7d8694';
  bctx.beginPath();
  bctx.moveTo(-3, -8); bctx.lineTo(-3, -SWORD_L + 8); bctx.lineTo(0, -SWORD_L); bctx.lineTo(3, -SWORD_L + 8); bctx.lineTo(3, -8);
  bctx.closePath(); bctx.fill();
  bctx.fillStyle = '#e4eaf2'; bctx.fillRect(-1.5, -SWORD_L + 7, 1.5, SWORD_L - 15);
  bctx.fillStyle = '#4a515c'; bctx.fillRect(2, -SWORD_L + 8, 1, SWORD_L - 16);
  // crossguard and grip
  bctx.fillStyle = '#c9a227'; bctx.fillRect(-8, -10, 16, 3);
  bctx.fillStyle = '#7a5a12'; bctx.fillRect(-8, -7, 16, 1);
  bctx.fillStyle = '#3a2418'; bctx.fillRect(-1.5, -7, 3, 10);
  bctx.fillStyle = '#5a3a26'; bctx.fillRect(-1.5, -5, 3, 1); bctx.fillRect(-1.5, -2, 3, 1);
  bctx.fillStyle = '#c9a227'; bctx.fillRect(-2, 3, 4, 3);
  bctx.restore();
}
function drawHitFlash() {
  if (P.hitFlash <= 0) return;
  const k = P.hitFlash / 0.15, cx = RW / 2, cy = RH * 0.45;
  bctx.strokeStyle = `rgba(255,240,180,${k})`; bctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 + 0.3;
    bctx.beginPath();
    bctx.moveTo(cx + Math.cos(a) * 4, cy + Math.sin(a) * 4);
    bctx.lineTo(cx + Math.cos(a) * (4 + 7 * k), cy + Math.sin(a) * (4 + 7 * k));
    bctx.stroke();
  }
  bctx.lineWidth = 1;
}
// ---------- held weapons ----------
// Style rules (from the user's reference shots: Wolf3D, Doom, Hexen, Heretic, Daggerfall):
//  * BIG: weapons fill the bottom 35-50% of the 320x200 buffer.
//  * Guns and the crossbow are CENTRED and seen from behind: near end at the bottom edge,
//    far end (muzzle/bolt tip) up toward the crosshair. Melee and magic come from the RIGHT.
//  * Everything is outlined (dark 1px edge) with 2-3 tone shading, and real hands with a
//    sleeve running off the bottom edge.
//  * Each weapon draws in LOCAL coordinates: x relative to its own centre, y = 0 at the
//    bottom of the screen, negative y = up. drawHeldWeapon() translates and adds walk bob.
const VPX = RW / 2, VPY = RH / 2;          // crosshair
const OUT = '#1e140c';
const SK = '#d9a273', SKD = '#a8693f', SKL = '#f2c597', SLV = '#4a3626';
const MT = '#5c6370', MTD = '#353941', MTL = '#a3acbb', BLK = '#0e0f12';
const WD = '#7a4e28', WDD = '#4e2f15', WDL = '#b07a44';
const RIGHT_X = RW / 2 + 62;               // screen x of right-hand weapons (wand, lightning)

function poly(pts, fill, line = OUT) {
  bctx.beginPath(); bctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) bctx.lineTo(pts[i], pts[i + 1]);
  bctx.closePath();
  if (line) { bctx.strokeStyle = line; bctx.lineWidth = 2; bctx.lineJoin = 'round'; bctx.stroke(); }
  bctx.fillStyle = fill; bctx.fill();
}
function ell(x, y, rx, ry, fill, line = OUT) {
  bctx.beginPath(); bctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (line) { bctx.strokeStyle = line; bctx.lineWidth = 2; bctx.stroke(); }
  bctx.fillStyle = fill; bctx.fill();
}
function box(x, y, w, h, fill) { bctx.fillStyle = fill; bctx.fillRect(x, y, w, h); }
function flash(x, y, size) {               // red/orange/yellow muzzle starburst
  if (P.flash <= 0) return;
  const layers = [['#d8321a', 1], ['#ff9a20', 0.68], ['#fff2a0', 0.36]];
  for (const [col, k] of layers) {
    bctx.fillStyle = col; bctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const ang = i * Math.PI / 8, r = (i % 2 ? 0.55 : 0.8 + Math.random() * 0.4) * size * k;
      bctx.lineTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r * 0.85);
    }
    bctx.closePath(); bctx.fill();
  }
}
// right fist, back of the hand to the camera, forearm and sleeve running off the bottom edge.
// (x, y) = middle of the fist; bottom = local y of the screen's bottom edge.
function drawBigFist(x, y, bottom = 0) {
  poly([x - 14, y + 6, x + 14, y + 6, x + 32, bottom + 4, x - 2, bottom + 4], SKD);   // forearm
  if (bottom - y > 26) poly([x - 6, bottom - 14, x + 34, bottom - 14, x + 40, bottom + 4, x - 8, bottom + 4], SLV);
  poly([x - 19, y - 12, x - 8, y - 17, x + 8, y - 17, x + 18, y - 12, x + 19, y + 8, x - 18, y + 10], SK);
  poly([x - 18, y + 4, x + 19, y + 3, x + 19, y + 8, x - 18, y + 10], SKD, null);   // underside shadow
  for (const k of [-12, -4, 4, 12]) ell(x + k, y - 14, 4.2, 3, SKL);                // knuckles
  for (const k of [-8, 0, 8]) box(x + k - 0.5, y - 11, 1, 13, SKD);                 // finger creases
  poly([x - 22, y - 6, x - 12, y - 9, x - 10, y + 4, x - 21, y + 6], SK);            // thumb
  box(x - 20, y - 5, 4, 3, SKL);
}

// ----- guns (centred) -----
function drawPistolArt(kick) {
  bctx.translate(0, -kick);
  poly([-15, -34, 15, -34, 14, -64, -14, -64], MTD);                 // frame
  poly([-14, -62, 14, -62, 9, -118, -9, -118], MT);                  // slide, receding toward the target
  poly([-12, -62, -7, -62, -5, -116, -8, -116], MTL, null);
  poly([8, -62, 13, -62, 8.5, -116, 5, -116], MTD, null);
  box(-13, -70, 6, 7, BLK); box(7, -70, 6, 7, BLK);                  // rear sight notch
  box(-1.5, -126, 3, 9, MTL);                                        // front sight blade
  ell(0, -118, 5, 2.5, BLK, null);
  poly([-30, 4, 30, 4, 27, -14, -27, -14], SLV);                     // sleeve
  poly([-22, -12, 22, -12, 24, -34, 16, -46, -16, -46, -24, -34], SK);   // hand round the grip
  poly([-22, -14, 22, -14, 23, -22, -23, -22], SKD, null);
  for (const k of [-12, -4, 4, 12]) ell(k, -45, 4.2, 3, SKL);
  for (const k of [-8, 0, 8]) box(k - 0.5, -43, 1, 11, SKD);
  poly([-24, -34, -15, -38, -13, -60, -20, -58], SK);                // thumb up the frame
  flash(0, -132, 26);
  bctx.translate(0, kick);
}
function drawShotgunArt(kick, pump) {
  bctx.translate(0, -kick);
  poly([-30, 4, 30, 4, 27, -28, -27, -28], WD);                      // stock
  poly([-26, -26, 26, -26, 23, -50, -23, -50], MTD);                 // receiver
  bctx.save(); bctx.translate(0, pump);                              // fore-end pumps back after a shot
  poly([-25, -56, 25, -56, 20, -98, -20, -98], WD);
  poly([-23, -58, -16, -58, -14, -96, -18, -96], WDL, null);
  bctx.restore();
  poly([-19, -48, -1, -48, -1, -132, -13, -132], MT);                // twin barrels
  poly([1, -48, 19, -48, 13, -132, 1, -132], MT);
  poly([-17, -48, -12, -48, -10, -130, -12, -130], MTL, null);
  poly([3, -48, 8, -48, 5, -130, 3, -130], MTL, null);
  poly([14, -48, 19, -48, 13, -130, 11, -130], MTD, null);
  ell(-7, -132, 6, 3, BLK); ell(7, -132, 6, 3, BLK);
  box(-1, -138, 2, 4, '#e8d8a0');                                    // bead sight
  bctx.save(); bctx.translate(0, pump);                              // left hand on the fore-end
  poly([-70, 4, -44, 4, -28, -52, -42, -58], SLV);
  poly([-44, -56, -28, -50, -18, -62, -18, -88, -30, -94, -42, -82], SK);
  for (let i = 0; i < 3; i++) { poly([-22, -88 + i * 9, -14, -88 + i * 9, -14, -81 + i * 9, -22, -81 + i * 9], SK); }
  bctx.restore();
  poly([14, 4, 50, 4, 46, -16, 38, -30, 18, -30, 10, -16], SK);      // right hand on the grip
  for (const k of [20, 28, 36]) ell(k, -29, 4, 2.6, SKL);
  flash(0, -146, 34);
  bctx.translate(0, kick);
}

// ----- right-hand weapons -----
function drawWandArt(a) {
  const bx = 8, by = -34, tx = -24 - a * 4, ty = -112 - a * 8;      // thrust toward the crosshair when casting
  bctx.lineCap = 'round';
  bctx.strokeStyle = OUT; bctx.lineWidth = 9; bctx.beginPath(); bctx.moveTo(bx, by); bctx.lineTo(tx, ty); bctx.stroke();
  bctx.strokeStyle = WD; bctx.lineWidth = 6; bctx.beginPath(); bctx.moveTo(bx, by); bctx.lineTo(tx, ty); bctx.stroke();
  bctx.strokeStyle = WDL; bctx.lineWidth = 1.5; bctx.beginPath(); bctx.moveTo(bx - 2, by); bctx.lineTo(tx - 2, ty); bctx.stroke();
  bctx.lineCap = 'butt';
  const gx = bx + (tx - bx) * 0.86, gy = by + (ty - by) * 0.86;
  ell(gx, gy, 5, 3, '#c9a227');                                      // gold band
  const ox = tx - 2, oy = ty - 8, pulse = Math.sin(performance.now() / 120);
  bctx.fillStyle = `rgba(170,80,255,${0.25 + a * 0.35})`;
  bctx.beginPath(); bctx.arc(ox, oy, 15 + a * 9 + pulse, 0, Math.PI * 2); bctx.fill();
  ell(ox, oy, 8, 8, '#9a3ae0');
  ell(ox - 1, oy - 1, 4.5, 4.5, '#e8c8ff', null);
  box(ox - 4, oy - 5, 2, 2, '#fff');
  const t = performance.now() / 400;
  for (let i = 0; i < 3; i++) box(ox + Math.cos(t + i * 2.1) * 13 - 1, oy + Math.sin(t + i * 2.1) * 8 - 1, 2, 2, '#e8c8ff');
  drawBigFist(bx, by);
}
// open casting hand for lightning; palmPoint() (screen coords) is also where bolts start (see drawBolts)
function palmPoint(a) { if (artReady('lightning')) { const [x, y] = artTip('lightning'); return [x, y + 2]; } return [RIGHT_X - 4 - a * 4, RH - 100 - a * 6]; }
function drawCastHand(a) {
  bctx.save(); bctx.translate(-a * 4, -a * 6);
  poly([-14, -40, 16, -40, 34, 4, -2, 4], SKD);                      // forearm
  poly([-6, -16, 36, -16, 40, 4, -8, 4], SLV);                       // sleeve
  poly([-20, -40, 20, -40, 22, -62, 14, -70, -14, -70, -22, -62], SK);   // back of the hand
  const fingers = [[-12, -0.34, 26], [-4, -0.11, 31], [4, 0.11, 30], [12, 0.34, 25]];
  for (const [fx, ang, len] of fingers) {                            // fingers spread toward the target
    bctx.save(); bctx.translate(fx, -66); bctx.rotate(ang);
    poly([-4, 0, 4, 0, 3.5, -len, -3.5, -len], SK);
    box(-3, -len + 1, 6, 4, SKL); box(-4, -len * 0.5, 8, 1, SKD);
    bctx.restore();
  }
  bctx.save(); bctx.translate(-20, -48); bctx.rotate(-1.0);           // thumb
  poly([-4, 0, 4, 0, 3.5, -20, -3.5, -20], SK); bctx.restore();
  for (const k of [-12, -4, 4, 12]) ell(k, -66, 3.6, 2.4, SKL);
  const fx = -4, fy = -100;                                           // charge between the fingertips
  bctx.fillStyle = `rgba(80,160,255,${0.22 + a * 0.45})`;
  bctx.beginPath(); bctx.arc(fx, fy, 12 + a * 14, 0, Math.PI * 2); bctx.fill();
  ell(fx, fy, 3 + a * 3, 3 + a * 3, '#e8f6ff', null);
  if (a > 0.02 || Math.random() < 0.3) {                             // arcs crawling over the hand
    bctx.strokeStyle = '#bfe6ff'; bctx.lineWidth = 1;
    for (let k = 0; k < 2 + (a * 4 | 0); k++) {
      let x = rnd(-18, 18), y = rnd(-96, -60);
      bctx.beginPath(); bctx.moveTo(x, y);
      for (let j = 0; j < 3; j++) { x += rnd(-6, 6); y += rnd(-6, 4); bctx.lineTo(x, y); }
      bctx.stroke();
    }
  }
  bctx.restore();
}

// ---------- sprite-art weapons ----------
// Pistol, shotgun, fist, wand and lightning hand use pixelated photo-hand frames from assets.js
// (built by tools/pack_assets.py from art/). Each frame is a 160x90 image drawn bottom-aligned
// at 2x, so it fills the 320-wide buffer exactly as authored. At rest a weapon shows `idle`.
// While P.anim runs 1 -> 0 it steps through `seq` = [[untilProgress, frameIndex], ...],
// where progress = 1 - P.anim. `glow` adds an orange halo behind a muzzle-flash frame.
const ART = {
  pistol:    { idle: 0, seq: [[0.16, 1], [0.34, 2], [0.52, 3], [0.80, 4]], glow: { 1: 9, 2: 13, 3: 18 } },
  shotgun:   { idle: 4, seq: [[0.08, 1], [0.17, 2], [0.28, 3], [0.80, 0], [0.92, 4]], glow: { 1: 14, 2: 20, 3: 30 } },
  fist:      { idle: 0, seq: [[0.2, 1], [0.5, 2], [0.78, 1]] },
  wand:      { idle: 0, seq: [[0.2, 1], [0.55, 2], [0.8, 1]] },
  lightning: { idle: 0, seq: [[0.2, 1], [0.55, 2], [0.8, 1]] }
};
const artImgs = {};
if (window.ASSETS) for (const k in ASSETS) artImgs[k] = ASSETS[k].frames.map(src => { const im = new Image(); im.src = src; return im; });
function artReady(w) { const f = artImgs[w]; return !!(f && ART[w] && f.every(im => im.complete && im.naturalWidth > 0)); }
function artFrame(w) {
  const q = ART[w];
  if (P.anim <= 0.001) return q.idle;
  const pr = 1 - P.anim;
  for (const [u, f] of q.seq) if (pr < u) return f;
  return q.idle;
}
function artTip(w) { const i = artFrame(w), t = ASSETS[w].tips[i]; return [t[0] * 2, RH - 180 + t[1] * 2]; }
function drawArtWeapon(w) {
  const i = artFrame(w), q = ART[w], a = P.anim, [tx, ty] = artTip(w);
  bctx.imageSmoothingEnabled = false;
  const gl = q.glow && q.glow[i];
  if (gl) {                                              // halo behind the baked-in muzzle flash
    bctx.fillStyle = 'rgba(255,150,40,0.55)'; bctx.beginPath(); bctx.arc(tx, ty + 6, gl, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = 'rgba(255,230,120,0.7)'; bctx.beginPath(); bctx.arc(tx, ty + 6, gl * 0.5, 0, Math.PI * 2); bctx.fill();
  }
  bctx.drawImage(artImgs[w][i], 0, RH - 180, RW, 180);
  const pulse = Math.sin(performance.now() / 120);
  if (w === 'wand') {                                    // glowing orb on the wand tip, flares when casting
    const ox = tx, oy = ty - 5;
    bctx.fillStyle = `rgba(170,80,255,${0.3 + a * 0.35})`; bctx.beginPath(); bctx.arc(ox, oy, 11 + a * 10 + pulse, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#b052f0'; bctx.beginPath(); bctx.arc(ox, oy, 6 + a * 2, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#f2dcff'; bctx.beginPath(); bctx.arc(ox - 1, oy - 1, 3, 0, Math.PI * 2); bctx.fill();
  } else if (w === 'lightning') {                        // charge crackling between the fingertips
    bctx.fillStyle = `rgba(80,160,255,${0.2 + a * 0.4})`; bctx.beginPath(); bctx.arc(tx, ty + 2, 8 + a * 12 + pulse * 0.6, 0, Math.PI * 2); bctx.fill();
    bctx.fillStyle = '#e8f6ff'; bctx.beginPath(); bctx.arc(tx, ty + 2, 2 + a * 3, 0, Math.PI * 2); bctx.fill();
    if (a > 0.02 || Math.random() < 0.3) {
      bctx.strokeStyle = '#bfe6ff'; bctx.lineWidth = 1;
      for (let k = 0; k < 2 + (a * 3 | 0); k++) {
        let x = tx + rnd(-14, 14), y = ty + rnd(-8, 22);
        bctx.beginPath(); bctx.moveTo(x, y);
        for (let j = 0; j < 3; j++) { x += rnd(-5, 5); y += rnd(-6, 3); bctx.lineTo(x, y); }
        bctx.stroke();
      }
    }
  }
}

// walk bob: weapons sway as the player moves (Doom/Wolf3D style)
let bobPh = 0, bobAmt = 0, bobLX = 0, bobLY = 0;
function drawHeldWeapon(cx, base, rec) {
  const a = P.anim;
  const mv = Math.min(0.2, Math.hypot(P.x - bobLX, P.y - bobLY)); bobLX = P.x; bobLY = P.y;
  bobAmt += (Math.min(1, mv / 0.05) - bobAmt) * 0.12; bobPh += mv * 9;   // sway grows with walking speed
  const bx = Math.round(Math.sin(bobPh) * 6 * bobAmt), by = Math.round(Math.abs(Math.cos(bobPh)) * 5 * bobAmt);
  const kick = P.flash > 0 ? 7 : 0;
  bctx.save(); bctx.translate(bx, by);
  if (artReady(P.weapon)) {
    drawArtWeapon(P.weapon);
  } else {
    const centred = ['pistol', 'shotgun'].includes(P.weapon);
    bctx.save(); bctx.translate(centred ? RW / 2 : RIGHT_X, RH);
    if (centred) bctx.scale(0.9, 0.82);   // muzzle ends just below the crosshair
    switch (P.weapon) {
      case 'shotgun': drawShotgunArt(kick, a > 0.15 && a < 0.85 ? 12 * Math.sin(Math.PI * (0.85 - a) / 0.7) : 0); break;
      case 'wand': drawWandArt(a); break;
      case 'lightning': drawCastHand(a); break;
      case 'fist': drawBigFist(0, -40); break;
      default: drawPistolArt(kick);
    }
    bctx.restore();
  }
  bctx.restore();
}
function drawOverlays() {
  // weapon in hand
  const cx = RW / 2, base = RH, rec = P.flash > 0 ? 5 : 0;
  drawHeldWeapon(cx, base, rec);
  // damage tint
  if (P.hurt > 0) {
    bctx.fillStyle = `rgba(200,0,0,${Math.min(0.45, P.hurt * 1.5)})`;
    bctx.fillRect(0, 0, RW, RH);
  }
  drawHitFlash();
  drawBolts();
  drawArrowShots();
  // minimap
  if (mapOn && level > 0) {
    const cs = 2, ox = 4, oy = 4;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!explored[y * W + x]) continue;
      const t = map[y * W + x];
      bctx.fillStyle = t === STAIRS ? '#e8d9a0' : (t > 0 ? '#8a8a8a' : '#2e2e35');
      bctx.fillRect(ox + x * cs, oy + y * cs, cs, cs);
    }
    const colors = { potion: '#4f4', crate: '#e0b737', ammo: '#aab', drop: '#aab' };
    for (const it of items) {
      const i = Math.floor(it.y) * W + Math.floor(it.x);
      if (explored[i]) { bctx.fillStyle = colors[it.kind]; bctx.fillRect(ox + Math.floor(it.x) * cs, oy + Math.floor(it.y) * cs, cs, cs); }
    }
    for (const m of monsters) {
      if (m.dead) continue;
      const i = Math.floor(m.y) * W + Math.floor(m.x);
      if (explored[i]) { bctx.fillStyle = m.boss ? '#c0f' : '#f44'; bctx.fillRect(ox + Math.floor(m.x) * cs, oy + Math.floor(m.y) * cs, cs, cs); }
    }
    bctx.fillStyle = '#ffe14d';
    bctx.fillRect(ox + P.x * cs - 1, oy + P.y * cs - 1, 2, 2);
    for (let k = 1; k <= 4; k++)
      bctx.fillRect(ox + (P.x + Math.cos(P.a) * k * 0.6) * cs, oy + (P.y + Math.sin(P.a) * k * 0.6) * cs, 1, 1);
  }
}

function render() {
  const dirX = Math.cos(P.a), dirY = Math.sin(P.a);
  const planeX = -dirY * FOV_PLANE, planeY = dirX * FOV_PLANE;
  renderFloorCeil(dirX, dirY, planeX, planeY);
  renderWalls(dirX, dirY, planeX, planeY);
  renderSprites(dirX, dirY, planeX, planeY);
  bctx.putImageData(img, 0, 0);
  drawOverlays();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = Math.min(canvas.width / RW, canvas.height / RH);
  const dw = RW * s, dh = RH * s;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
}

// The game draws only in the space RQPad leaves free (its side panels take the rest).
function resize() {
  const s = (window.RQPad && RQPad.stage) || { x: 0, y: 0, width: innerWidth, height: innerHeight };
  canvas.width = Math.max(1, Math.floor(s.width));
  canvas.height = Math.max(1, Math.floor(s.height));
  const hud = document.getElementById('hud');
  hud.style.left = (s.x + 12) + 'px';
  hud.style.right = (innerWidth - s.x - s.width + 12) + 'px';
  const ov = document.getElementById('overlay');   // title screen sits in the same free area
  ov.style.left = s.x + 'px'; ov.style.right = (innerWidth - s.x - s.width) + 'px';
  ov.style.top = s.y + 'px'; ov.style.bottom = (innerHeight - s.y - s.height) + 'px';
  // intro: largest 16:9 box inside the free area, so the cutscene never sits under the pad
  const iw = Math.min(s.width, s.height * 16 / 9), ih = iw * 9 / 16;
  Object.assign(introCanvas.style, { left: (s.x + (s.width - iw) / 2) + 'px', top: (s.y + (s.height - ih) / 2) + 'px',
    width: iw + 'px', height: ih + 'px', transform: 'none' });
  Object.assign(capEl.style, { left: s.x + 'px', right: (innerWidth - s.x - s.width) + 'px',
    top: 'auto', bottom: (innerHeight - (s.y + (s.height + ih) / 2) + ih * 0.08) + 'px' });
}

// ---------- intro cinematic (Three.js, low-res PS1-style) ----------
const PMAX = 520, PR = 6;
const CAM = [
  { t: 0,    p: [-18, 3, 24],   l: [0, 6, 0] },
  { t: 2.5,  p: [-18, 3, 24],   l: [0, 8, 0] },
  { t: 4.5,  p: [-18, 4, 24],   l: [0, 40, 0] },
  { t: 8,    p: [-50, 45, 85],  l: [0, 130, 0] },
  { t: 12,   p: [-70, 120, 130], l: [0, 300, 0] },
  { t: 14.5, p: [0, 2.4, 22],   l: [0, 3.5, 6.2] },
  { t: 16,   p: [0, 2.4, 15],   l: [0, 3.5, 6.2] }
];
const CAPS = [[0.3, 'A: Did you hear that?'], [1.5, 'B: Hear what?'], [2.0, 'A: Something stirred beneath the crypt...'], [2.6, 'The Spire rose from the earth.'],
  [6, 'Something rose from the dirt.'], [9, 'It did not stop climbing.'], [12.4, 'The sky went dark.'], [14.2, 'The entrance awaits.']];
let intro = null;

function buildIntro() {
  const renderer = new THREE.WebGLRenderer({ canvas: introCanvas, antialias: false });
  renderer.setPixelRatio(1);
  renderer.setSize(320, 180, false);
  const scene = new THREE.Scene();
  const SKY = 0x8f9fc4;            // dusk blue, darkens to storm as the Spire rises
  // photo tiles from assets.js on the intro models (pixel-crisp, repeating); plain colours if assets.js is missing
  const tileTex = (name, rx, ry) => {
    if (!window.TILES || !TILES[name]) return null;
    const tx = new THREE.TextureLoader().load(TILES[name]);
    tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.NearestFilter;
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rx, ry);
    return tx;
  };
  const texMat = (name, rx, ry, col, fb) => { const map = tileTex(name, rx, ry); return new THREE.MeshLambertMaterial(map ? { map, color: col } : { color: fb, flatShading: true }); };
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 150, 480);
  const cam = new THREE.PerspectiveCamera(55, 320 / 180, 0.5, 1200);
  const ambient = new THREE.AmbientLight(0xb8c0e0, 0.6);
  scene.add(ambient);
  scene.add(new THREE.HemisphereLight(0x9fb0ff, 0x3a2a18, 0.35));           // cool sky above, earthy bounce below
  const sun = new THREE.DirectionalLight(0xffb070, 1.0);                       // low, warm sunset light raking the tower
  sun.position.set(-90, 45, 70); scene.add(sun);
  const torches = [-3.6, 3.6].map(x => {                                       // flickering torches either side of the door
    const l = new THREE.PointLight(0xff8a2a, 2.2, 22, 2); l.position.set(x, 6.2, 1.6);   // added to the door group below, so they rise with it
    const flame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.5), new THREE.MeshBasicMaterial({ color: 0xffb040 }));
    flame.position.copy(l.position); l.userData.flame = flame; return l;
  });

  // rolling low-poly ground, flat near the tower
  const gGeo = new THREE.PlaneGeometry(900, 900, 70, 70);
  gGeo.rotateX(-Math.PI / 2);
  const gp = gGeo.attributes.position;
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i);
    const amp = Math.min(1, Math.max(0, (Math.hypot(x, z) - 14) / 25));
    gp.setY(i, (Math.sin(x * 0.05) * 2.2 + Math.cos(z * 0.06) * 2.6 + Math.sin((x + z) * 0.13) * 1.4) * amp);
  }
  gGeo.computeVertexNormals();
  scene.add(new THREE.Mesh(gGeo, texMat('cobbles', 160, 160, 0xa8bc84, 0x607f40)));   // mossy tinted cobbles

  // the Spire
  const pillar = new THREE.Group(); scene.add(pillar);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(PR, PR, 1, 8, 1, true),
    texMat('stone_blocks', 8, 1, 0xd8cbb0, 0xc2b48f));    // repeat.y follows the height as it rises (see the scale.y update)
  shaft.position.y = 0.5; shaft.visible = false; pillar.add(shaft);
  const bandMat = texMat('stone_arches', 8, 0.4, 0x9a8a70, 0x6e5a40);
  const winMat = new THREE.MeshBasicMaterial({ color: 0xffa040 });     // lit windows glow in the dusk
  const winGeo = new THREE.BoxGeometry(1.6, 3, 0.5);
  const bands = [];
  for (let y = 24; y < PMAX; y += 24) {
    const g = new THREE.Group(); g.position.y = y; g.userData.y = y;
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(PR + 0.3, PR + 0.3, 1.6, 8), bandMat));
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2;
      const w = new THREE.Mesh(winGeo, winMat);
      w.position.set(Math.cos(a) * (PR + 0.35), 0, Math.sin(a) * (PR + 0.35));
      w.rotation.y = -a;
      g.add(w);
    }
    pillar.add(g); bands.push(g);
  }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0, PR * 1.2, 44, 8),
    texMat('rust', 4, 6, 0xb08060, 0x8a6a3a));
  spire.visible = false; scene.add(spire);

  // entrance door on the +z face
  const door = new THREE.Group(); door.position.set(0, 0, PR); scene.add(door);
  for (const l of torches) door.add(l, l.userData.flame);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(5.4, 8.4, 0.3), texMat('stone_blocks', 1.4, 2, 0xb0a080, 0xc9a227));
  frame.position.set(0, 4.2, 0.1); door.add(frame);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(4.2, 7.5, 0.5), texMat('wood_door', 1, 1, 0xffffff, 0x3a2412));
  panel.position.set(0, 3.75, 0.45); door.add(panel);
  const step = new THREE.Mesh(new THREE.BoxGeometry(9, 0.8, 4), texMat('flagstone', 2.5, 1, 0xc0b8a8, 0x9a9080));
  step.position.set(0, 0.4, 2.5); door.add(step);

  // clouds
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
  for (let i = 0; i < 14; i++) {
    const g = new THREE.Group();
    for (let k = 0; k < 4; k++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(rnd(20, 40), rnd(6, 10), rnd(14, 26)), cloudMat);
      b.position.set(rnd(-14, 14), rnd(-3, 3), rnd(-10, 10));
      g.add(b);
    }
    g.position.set(rnd(-200, 200), rnd(110, 230), rnd(-200, 200));
    scene.add(g);
  }

  // rubble pool
  const debGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
  const debMat = texMat('stone_blocks', 0.5, 0.5, 0xc8b898, 0xb3a27f);
  const debris = [];
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(debGeo, debMat); m.visible = false; scene.add(m);
    debris.push({ m, v: new THREE.Vector3(), spin: new THREE.Vector3(), alive: false });
  }

  // ---- NPCs: blocky placeholder figures (swap for real models later) ----
  const cloth = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
  const makeHuman = (clothColor, x, z) => {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.7), cloth(clothColor)); body.position.y = 2.3; g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), cloth(0xd9b38c)); head.position.y = 3.6; g.add(head);
    const legMat = cloth(0x3a3a4a);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.3, 0.4), legMat); legL.position.set(-0.3, 0.65, 0); g.add(legL);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.3, 0.4), legMat); legR.position.set(0.3, 0.65, 0); g.add(legR);
    const mkArm = sx => {
      const pivot = new THREE.Group(); pivot.position.set(sx * 0.8, 2.9, 0);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.3, 0.35), cloth(clothColor));
      arm.position.y = -0.65; pivot.add(arm); g.add(pivot); return pivot;
    };
    const armL = mkArm(-1), armR = mkArm(1);
    scene.add(g);
    return { g, head, armL, armR };
  };
  const npcA = makeHuman(0x7a4a2a, -8, 8);   // talks, then gets flung
  const npcB = makeHuman(0x2f5a7a, 6, 6);    // listens, then gets flung
  npcA.vel = new THREE.Vector3(); npcA.landed = false; npcA.launched = false; npcA.spin = 0;
  npcB.vel = new THREE.Vector3(); npcB.landed = false; npcB.launched = false; npcB.spin = 0;

  // ---- skeletons rising from the dirt ----
  const boneMat = cloth(0xd8d2bd), ribMat = cloth(0x9a947e), darkMat = cloth(0x1a1a1a);
  const makeSkeleton = (x, z, startT) => {
    const g = new THREE.Group();
    g.position.set(x, -4, z); g.scale.setScalar(1.3);
    const part = (geo, mat, px, py, pz) => { const m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); };
    part(new THREE.BoxGeometry(0.7, 0.7, 0.7), boneMat, 0, 4.2, 0);
    part(new THREE.BoxGeometry(0.16, 0.16, 0.05), darkMat, -0.17, 4.25, 0.37);
    part(new THREE.BoxGeometry(0.16, 0.16, 0.05), darkMat, 0.17, 4.25, 0.37);
    part(new THREE.BoxGeometry(1.0, 1.4, 0.5), ribMat, 0, 2.9, 0);
    part(new THREE.BoxGeometry(0.8, 0.5, 0.4), boneMat, 0, 1.9, 0);
    part(new THREE.BoxGeometry(0.22, 1.5, 0.22), boneMat, -0.25, 0.75, 0);
    part(new THREE.BoxGeometry(0.22, 1.5, 0.22), boneMat, 0.25, 0.75, 0);
    part(new THREE.BoxGeometry(0.2, 1.4, 0.2), boneMat, -0.7, 2.9, 0);
    part(new THREE.BoxGeometry(0.2, 1.4, 0.2), boneMat, 0.7, 2.9, 0);
    scene.add(g);
    return { g, x, z, startT, dirt: false };
  };
  const skeletons = [makeSkeleton(-22, 16, 6.0), makeSkeleton(-13, 24, 6.5), makeSkeleton(14, 22, 7.0),
    makeSkeleton(24, 10, 7.4), makeSkeleton(-3, 30, 7.9)];

  // ---- a bird wheeling through the clouds ----
  const birdMat = cloth(0x1d1a18);
  const bird = new THREE.Group(); bird.scale.setScalar(1.6); bird.rotation.y = Math.PI / 2; scene.add(bird);
  bird.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 1.6), birdMat));
  const wingL = new THREE.Group(), wingR = new THREE.Group();
  const wlMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.0), birdMat); wlMesh.position.x = -1.6; wingL.add(wlMesh);
  const wrMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.0), birdMat); wrMesh.position.x = 1.6; wingR.add(wrMesh);
  bird.add(wingL); bird.add(wingR);

  // ---- lightning: one jagged bolt line, reshaped for each strike ----
  const bolt = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xe8eeff }));
  bolt.visible = false; scene.add(bolt);

  intro = { renderer, scene, cam, t: 0, shaft, bands, spire, debris, nextDebris: 0, door,
    ambient, sun, torches, npcA, npcB, skeletons, bird, wingL, wingR, bolt,
    strikes: [9.6, 12.4, 13.1], strikeIdx: 0, boltT: 0, flashT: 0,
    SKY_COL: new THREE.Color(SKY), DARK_COL: new THREE.Color(0x202233), FLASH_COL: new THREE.Color(0xdfe7ff) };
  return intro;
}

function spawnDebris(ox = 0, oz = 0) {
  const I = intro;
  const d = I.debris[I.nextDebris++ % I.debris.length];
  const a = rnd(0, Math.PI * 2), r = rnd(0, PR * 0.9);
  d.m.position.set(Math.cos(a) * r + ox, 1, Math.sin(a) * r + oz);
  d.v.set(rnd(-14, 14), rnd(18, 38), rnd(-14, 14));
  d.spin.set(rnd(-8, 8), rnd(-8, 8), rnd(-8, 8));
  d.m.visible = true; d.alive = true;
}
function sampleCam(t) {
  let i = 0;
  while (i < CAM.length - 2 && t > CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[i + 1];
  let u = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)));
  u = u * u * (3 - 2 * u);
  return { p: a.p.map((v, k) => v + (b.p[k] - v) * u), l: a.l.map((v, k) => v + (b.l[k] - v) * u) };
}
let capIdx = 0;
function stepIntro(dt) {
  const I = intro, t = (I.t += dt);
  let h = 0;
  if (t > 2.5) h = (1 - Math.pow(1 - Math.min(1, (t - 2.5) / 2.2), 3)) * 60 + Math.max(0, t - 4.7) * 42;
  h = Math.min(h, PMAX);
  // the whole tower (door included) starts 10 units underground and rises out of the dirt
  const rise = Math.min(1, Math.max(0, (t - 2.5) / 2.2));
  const base = -10 * Math.pow(1 - rise, 3);
  I.door.position.y = base;
  I.shaft.visible = h - base > 0.1;
  I.shaft.position.y = (h + base) / 2;
  I.shaft.scale.y = Math.max(h - base, 0.01);
  if (I.shaft.material.map) I.shaft.material.map.repeat.y = I.shaft.scale.y / 4.7;   // keep the blocks square as it grows
  for (const b of I.bands) { b.position.y = base + b.userData.y; b.visible = base + b.userData.y < h; }
  I.spire.visible = h > 1;
  I.spire.position.set(0, h + 22, 0);

  if (t > 2.5 && t < 4.6) for (let k = 0; k < 3; k++) spawnDebris();
  for (const d of I.debris) {
    if (!d.alive) continue;
    d.v.y -= 38 * dt;
    d.m.position.addScaledVector(d.v, dt);
    d.m.rotation.x += d.spin.x * dt; d.m.rotation.z += d.spin.z * dt;
    if (d.m.position.y < 0.6) {
      d.m.position.y = 0.6; d.v.y *= -0.35; d.v.x *= 0.6; d.v.z *= 0.6;
      if (Math.abs(d.v.y) < 1.5) { d.v.set(0, 0, 0); d.alive = false; d.m.rotation.set(rnd(0, 6), rnd(0, 6), 0); }
    }
  }

  const easeOutN = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  // the two NPCs: talking at the door, then the eruption flings them away
  const A = I.npcA, B = I.npcB;
  const LAUNCH = 2.6;
  if (t < LAUNCH) {
    A.armR.rotation.x = -0.9 + Math.sin(t * 5) * 0.4;     // A gestures while talking
    A.head.rotation.y = Math.sin(t * 1.3) * 0.2;
    B.head.rotation.y = Math.sin(t * 2.1) * 0.25;         // B listens and shakes its head
    A.g.position.y = 0.05 * Math.max(0, Math.sin(t * 5));
  }
  // both throw their arms up as the ground breaks
  const raise = t > 2.0 ? (t < 3.0 ? easeOutN((t - 2.0) / 0.25) : 1 - easeOutN((t - 3.0) / 0.5)) : 0;
  A.armL.rotation.x = -2.6 * raise;
  A.armR.rotation.x = -2.6 * raise;
  B.armL.rotation.x = -2.6 * raise;
  B.armR.rotation.x = -2.6 * raise;

  for (const N of [A, B]) {
    if (t < LAUNCH || N.landed) continue;
    if (!N.launched) {
      N.launched = true;
      const ox = N.g.position.x, oz = N.g.position.z, dd = Math.hypot(ox, oz) || 1;
      N.vel.set(ox / dd * 16 + rnd(-2, 2), 22, oz / dd * 16);   // thrown outward from the tower
      N.spin = rnd(4, 7) * (Math.random() < 0.5 ? -1 : 1);
    }
    N.vel.y -= 32 * dt;
    N.g.position.addScaledVector(N.vel, dt);
    N.g.rotation.z += N.spin * dt;
    if (N.g.position.y <= 0 && N.vel.y < 0) {
      N.landed = true; N.vel.set(0, 0, 0);
      N.g.position.y = 0.4;
      N.g.rotation.z = N.spin > 0 ? Math.PI / 2 : -Math.PI / 2;   // lies where it fell
    }
  }

  // skeletons burst out of the ground
  for (const s of I.skeletons) {
    if (t >= s.startT && !s.dirt) { s.dirt = true; for (let k = 0; k < 8; k++) spawnDebris(s.x, s.z); }
    s.g.position.y = -4 + 4 * easeOutN((t - s.startT) / 1.4);
  }

  // bird gliding past with a steady flap
  I.bird.position.set(-100 + t * 12, 62 + Math.sin(t * 0.7) * 2, -8);
  const flap = Math.sin(t * 9) * 0.6;
  I.wingL.rotation.z = flap;
  I.wingR.rotation.z = -flap;

  // lightning strikes behind the spire
  while (I.strikeIdx < I.strikes.length && t >= I.strikes[I.strikeIdx]) {
    I.strikeIdx++;
    const pts = [];
    let x = rnd(-40, 40), z = rnd(-70, -30);
    for (let k = 0; k <= 14; k++) { pts.push(x, 190 - k * 13.5, z); x += rnd(-6, 6); z += rnd(-4, 4); }
    I.bolt.geometry.dispose();
    I.bolt.geometry = new THREE.BufferGeometry();
    I.bolt.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    I.bolt.visible = true; I.boltT = 0.14; I.flashT = 0.12;
  }
  I.boltT -= dt; if (I.boltT <= 0) I.bolt.visible = false;
  I.flashT -= dt;

  // the sky darkens over time; lightning briefly floods it
  const dk = Math.min(1, Math.max(0, (t - 5) / 7));
  I.ambient.intensity = 0.6 - 0.4 * dk + (I.flashT > 0 ? 1.2 : 0);
  I.sun.intensity = 1.0 - 0.75 * dk;                                   // the sunset fades under the storm
  for (const l of I.torches) {                                         // torches flicker and matter more as it darkens
    const f = 0.8 + 0.2 * Math.sin(t * 23 + l.position.x) + rnd(-0.12, 0.12);
    l.intensity = (2.0 + 1.6 * dk) * f; l.userData.flame.scale.y = 0.7 + 0.5 * f;
  }
  const skyNow = I.flashT > 0 ? I.FLASH_COL : I.SKY_COL.clone().lerp(I.DARK_COL, dk);
  I.scene.background.copy(skyNow);
  I.scene.fog.color.copy(skyNow);

  const c = sampleCam(t);
  // the ground shakes just before the eruption
  const shake = t > 2.0 && t < 3.0 ? (3.0 - t) * 0.6 : 0;
  I.cam.position.set(c.p[0] + rnd(-shake, shake), c.p[1] + rnd(-shake, shake), c.p[2] + rnd(-shake, shake));
  I.cam.lookAt(c.l[0], c.l[1], c.l[2]);

  while (capIdx < CAPS.length && t >= CAPS[capIdx][0]) { capEl.textContent = CAPS[capIdx][1]; capIdx++; }
  flashEl.style.opacity = Math.min(1, Math.max(0, (t - 15.2) / 0.8));
  I.renderer.render(I.scene, I.cam);
  if (t >= 16) endIntro();
}
function startIntro() {
  overlay.style.display = 'none';
  if (typeof THREE === 'undefined') { resetGame(); return; }
  if (!intro) buildIntro();
  intro.t = 0; capIdx = 0;
  introActive = true; introStartedAt = performance.now(); document.body.classList.add('intro');
  canvas.style.visibility = 'hidden';
  introCanvas.classList.add('on');
  capEl.style.display = 'block'; capEl.textContent = '';
  flashEl.style.transition = 'none'; flashEl.style.opacity = 0;
}
function endIntro() {
  if (!introActive) return;
  introActive = false; document.body.classList.remove('intro');
  introCanvas.classList.remove('on');
  capEl.style.display = 'none';
  canvas.style.visibility = 'visible';
  flashEl.style.transition = 'opacity .7s';
  flashEl.style.opacity = 1;
  setTimeout(() => { flashEl.style.opacity = 0; }, 60);
  resetGame();
}

// ---------- flow & input ----------
function resetGame() {
  level = 0; kills = 0;
  P = newPlayer();
  generateEntrance();
  running = true;
  overlay.style.display = 'none';
  showMsg('Step through the door.');
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}

const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
const WEAPON_KEYS = { Digit1: 'pistol', Digit2: 'shotgun', Digit3: 'wand', Digit4: 'lightning', Digit5: 'fist' };
addEventListener('keydown', e => {
  if (introActive) { if (['Space', 'Enter', 'Escape'].includes(e.code) && canSkipIntro()) endIntro(); return; }
  if (PREVENT.has(e.code)) e.preventDefault();
  // arcade start: Enter / Space / Escape (pad ✕ or START) on a menu; short delay so held fire does not skip GAME OVER
  if (!running && !introActive && overlay.style.display !== 'none' && ['Enter', 'Space', 'Escape'].includes(e.code)
      && !e.repeat && performance.now() - menuShownAt > 900) { $('go').click(); return; }
  keys[e.code] = true;
  if (e.code === 'KeyM' && !e.repeat) mapOn = !mapOn;
  if (WEAPON_KEYS[e.code] && running && P.owned[WEAPON_KEYS[e.code]]) { P.weapon = WEAPON_KEYS[e.code]; showMsg(WEAPONS[P.weapon].name); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// tap to skip the intro; ignore the press that started it and presses on the pad (its ✕ skips via the Space key)
let introStartedAt = 0;
const canSkipIntro = () => introActive && performance.now() - introStartedAt > 700;
addEventListener('pointerdown', e => { if (canSkipIntro() && !(e.target.closest && e.target.closest('.rqp-root'))) endIntro(); });
addEventListener('mousemove', e => {
  if (running && document.pointerLockElement === canvas) P.a += e.movementX * 0.0022;
});
canvas.addEventListener('pointerdown', e => { if (running && e.pointerType === 'mouse') fire(); });
addEventListener('resize', resize);
addEventListener('rqpad:layout', resize);
showMenu('CRYPT CRAWLER', 'Erupt from the crypt, climb the Spire floor by floor, and slay the guardians on every fifth level.', 'PRESS START');
$('go').addEventListener('click', () => {
  const cp = loadCheckpoint();
  if (cp && cp.floor > 1) { continueGame(cp); return; }      // a saved zone checkpoint beats starting over
  if (!introSeen) { introSeen = true; startIntro(); }
  else resetGame();
});
$('newclimb').addEventListener('click', e => {               // wipe the checkpoint and start from the crypt
  e.stopPropagation(); clearCheckpoint(); $('newclimb').style.display = 'none';
  $('go').textContent = 'PRESS START';
});

// ---------- phone controls: RQPad (rqpad.js) ----------
// Left stick -> movement, right stick -> turn, A -> fire (sends Space), X -> cycle gun, Y -> minimap.
RQPad.install({
  layout: 'dock',                  // default Switch-style layout: controller halves on the sides, game in the middle
  onlyOnTouch: false,              // test build: always shown; set true for release
  glyphs: 'playstation',
  labels: { A: 'FIRE', B: '', X: 'GUN', Y: 'MAP', L1: '', R1: '', L2: '', R2: '', START: 'MENU', SELECT: '' },
  keys: { moveKeys: 'wasd' }       // arrows would also turn the view, so only WASD is sent
});
RQPad.onStick = (which, x, y) => { if (which === 'move') { touchState.joyX = x; touchState.joyY = -y; } };
RQPad.onButton = (name, down) => {
  if (!down) return;
  if (name === 'X' && running) cycleWeapon();
  if (name === 'Y') mapOn = !mapOn;
}

// ---------- boot ----------
P = newPlayer();
generateEntrance();
resize();
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (introActive) {
    stepIntro(dt);
  } else {
    if (running) update(dt);
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Test hook: lets screenshot tooling (tools/shoot.py) run code inside this scope, e.g.
// window.__cc.eval("P.weapon = 'sword'"). Unused during normal play.
window.__cc = { eval: src => eval(src) };
})();
</script>
