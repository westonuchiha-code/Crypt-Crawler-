<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypt Crawler</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#ddd;user-select:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  /* PS1-style intro render (Three.js), letterboxed 16:9 */
  #intro3d{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(100vh,56.25vw);image-rendering:pixelated;display:none;background:#000}
  #intro3d.on{display:block}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  #caption{position:fixed;left:0;right:0;bottom:14%;text-align:center;font-size:clamp(12px,2.2vw,20px);padding:0 10px;box-sizing:border-box;color:#f2e6c0;text-shadow:0 2px 4px #000;letter-spacing:2px;pointer-events:none;display:none}
  body.intro #hud,body.intro #msg{display:none}
  #hud{position:fixed;left:12px;top:12px;right:90px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;pointer-events:none;text-shadow:0 1px 2px #000;font-size:14px}
  #hpbar{width:180px;height:12px;border:1px solid #777;background:#300}
  #hpfill{height:100%;width:100%;background:#c93030;transition:width .15s}
  #msg{position:fixed;top:44px;left:0;right:0;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .6s;font-size:16px;color:#f0d890;opacity:0}
  /* ---- arcade-style menus ---- */
  #overlay{overflow-y:auto;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 40%,rgba(60,0,0,.55),rgba(0,0,0,.92) 70%);font-family:ui-monospace,'Courier New',monospace;text-transform:uppercase}
  #overlay::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}   /* CRT scanlines */
  #overlay h1{margin:0;font:900 clamp(34px,8.5vw,84px)/0.9 Impact,'Arial Black','Roboto Condensed',sans-serif;letter-spacing:2px;
    transform:perspective(300px) rotateX(14deg) scaleY(1.25);
    background:linear-gradient(#fff6a8 0%,#ffd23a 22%,#ff7a12 48%,#c41a08 72%,#5a0600 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #300) drop-shadow(0 4px 0 #200) drop-shadow(0 6px 0 #100) drop-shadow(0 0 18px rgba(255,80,0,.55))}
  #overlay h1.dead{background:linear-gradient(#ff8a8a,#d00 50%,#400);-webkit-background-clip:text;background-clip:text}
  #tag{color:#ff8a3a;letter-spacing:6px;font-size:13px;margin:14px 0 2px;text-shadow:0 0 8px #f40}
  #overlay p{max-width:560px;line-height:1.5;margin:0;color:#c8c0b0;font-size:13px}
  #hiscore{color:#ffe14a;font-size:15px;letter-spacing:3px;text-shadow:0 0 6px #fa0}
  #hiscore b{color:#fff}
  #go{background:none;border:0;color:#fff;font:700 clamp(16px,3.4vw,24px) ui-monospace,'Courier New',monospace;letter-spacing:4px;padding:10px 18px;cursor:pointer;
    text-shadow:0 0 6px #f40,0 0 14px #f20;animation:blink 1s steps(2) infinite}
  #go:hover{color:#ffe14a}
  #newclimb{background:none;border:0;color:#a88;font:12px ui-monospace,monospace;letter-spacing:2px;text-decoration:underline;cursor:pointer;margin-top:-6px}
  @keyframes blink{50%{opacity:0}}
  #help{color:#777!important;font-size:11px!important}
  #credit{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;color:#e33;font-size:12px;letter-spacing:2px}
  @media (max-height:460px){#overlay{gap:6px}#overlay h1{font-size:clamp(28px,7vw,52px)}#overlay p{font-size:11px}#help{display:none}#tag{font-size:11px}}
  button:hover{background:#e0b737}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="intro3d"></canvas>
<div id="flash"></div>
<div id="caption"></div>
<div id="msg"></div>
<div id="hud"><div id="hpbar"><div id="hpfill"></div></div><div id="stats"></div></div>
<div id="overlay">
  <h1 id="title">CRYPT CRAWLER</h1>
  <div id="tag">— climb the spire —</div>
  <p id="intro">Erupt from the crypt, climb the Spire floor by floor, and slay the guardians on every fifth level.</p>
  <div id="hiscore"></div>
  <button id="go">PRESS START</button>
  <button id="newclimb" style="display:none">new climb (erase checkpoint)</button>
  <p id="help">Keys: WASD move · ←/→ turn · space fires · 1-5 weapons · M map &nbsp;|&nbsp; Pad: ✕ fire · □ gun · △ map · START</p>
  <div id="credit"><span>© 2026 CRYPT CRAWLER</span><span>CREDIT 1</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="rqpad.js"></script>
<script src="assets.js"></script>   <!-- generated by tools/pack_assets.py; the game falls back to drawn weapons if it is missing -->
<script>
(() => {
const RW = 320, RH = 200, FOV_PLANE = 0.66;   // internal low-res buffer, scaled up to the window
const STAIRS = 9, DOOR = 4, FINAL = 100;
// ---- the climb: 100 floors in 10 zones of 10; each zone ends with its boss on floor 10, 20 ... 100 ----
// theme = index into THEMES (surface tiles); zones 4-10 reuse tile mixes until they get their own art (plan step 3).
const ZONES = [
  { name: 'THE CRYPT',          boss: 'THE WARDEN',          theme: 1 },
  { name: 'THE SEWERS',         boss: 'THE SEWER KING',      theme: 2 },
  { name: 'THE CATACOMBS',      boss: 'THE HOLLOW QUEEN',    theme: 3 },
  { name: 'THE CASTLE HALLS',   boss: 'THE IRON CASTELLAN',  theme: 4 },
  { name: 'THE FOUNDRY',        boss: 'THE FORGEHEART',      theme: 5 },
  { name: 'THE SKY TOWER',      boss: 'THE STORM HERALD',    theme: 6 },
  { name: 'THE UPPER AIR',      boss: 'THE SKYWYRM',         theme: 7 },
  { name: 'THE VOID',           boss: 'THE VOID ARCHON',     theme: 8 },
  { name: 'THE ALIEN SPIRE',    boss: 'THE STAR-EATER',      theme: 9 },
  { name: 'THE OTHER WORLD',    boss: 'THE SPIRE TITAN',     theme: 10 }
];
const zoneOf = lv => Math.min(ZONES.length - 1, Math.max(0, Math.ceil(lv / 10) - 1));
const zoneStart = lv => zoneOf(lv) * 10 + 1;
const BOSS_NAMES = {}, BOSS_HP = {};
ZONES.forEach((z, i) => { BOSS_NAMES[(i + 1) * 10] = z.boss; BOSS_HP[(i + 1) * 10] = 600 + 300 * i; });   // 600 ... 3300
// difficulty grows per zone (not per floor, which would explode by floor 100), plus a little within each zone
const hpMul = lv => 1 + 0.15 * zoneOf(lv) + 0.01 * ((lv - 1) % 10);
const dmgMul = lv => 1 + 0.12 * zoneOf(lv);
// Damage is [min, max] per hit; enemy HP is on the same scale (imp 20, skeleton 30+, bosses 300-900).
// knock = shove back (cells), stun = seconds the enemy cannot move or attack. Bosses take 20% knock, 30% stun.
//  pistol    steady and accurate, infinite: ~35 dps at any range
//  shotgun   7 pellets; full damage within 2.5 cells, fading to 25% by 8 cells; big knockback (one-shots close up)
//  fist      last resort: weaker than the pistol (~18 dps), but shoves and staggers so you can make space
//  wand      fireball: direct hit plus splash on everything within 1.6 cells
//  lightning free crowd control: weaker hits that chain to 3 enemies (each jump 75%) and stun them
const WEAPONS = {
  fist:    { name: 'FIST',     type: 'melee',    cool: 0.55, dmg: [8, 12],  range: 1.5, arc: 0.7, knock: 1.6, stun: 0.45, ammo: false, animDur: 0.5 },
  pistol:  { name: 'PISTOL',   type: 'hitscan',  cool: 0.34, dmg: [10, 14], pellets: 1, spread: 0.01, stun: 0.08, ammo: true },
  shotgun: { name: 'SHOTGUN',  type: 'hitscan',  cool: 0.90, dmg: [7, 11],  pellets: 7, spread: 0.12, near: 2.5, far: 8, knock: 0.45, stun: 0.12, ammo: true, animDur: 0.85 },
  wand:    { name: 'WAND',     type: 'fireball', cool: 0.75, dmg: [26, 34], speed: 6, blast: 1.6, blastDmg: [14, 20], knock: 1.0, ammo: true, animDur: 0.6 },
  lightning:{ name: 'LIGHTNING', type: 'chain',   cool: 0.65, dmg: [12, 16], range: 6, arc: 0.35, chain: 2.5, jumps: 3, falloff: 0.75, stun: 0.4, ammo: true, animDur: 0.6 }
};
// Loot. A weapon crate holds one gun (deeper floors unlock more) plus its starting ammo; ammo boxes stock every pool,
// even for guns you do not have yet. When a gun runs dry it leaves your weapon cycle until you find another.
const WEAPON_FLOOR = { pistol: 1, shotgun: 3, wand: 6, lightning: 9 };       // first floor each gun can appear on
const CRATE_AMMO = { pistol: 24, shotgun: 8, wand: 8, lightning: 10 };
const BOX_AMMO = { pistol: 12, shotgun: 4, wand: 3, lightning: 3 };
const AMMO_NAME = { pistol: 'bullets', shotgun: 'shells', wand: 'charges', lightning: 'sparks' };
const roll = d => Array.isArray(d) ? Math.round(rnd(d[0], d[1])) : d;
const WEAPON_ORDER = ['pistol', 'shotgun', 'wand', 'lightning', 'fist'];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const buf = document.createElement('canvas');
buf.width = RW; buf.height = RH;
const bctx = buf.getContext('2d');
const img = bctx.createImageData(RW, RH);
const pix = new Uint32Array(img.data.buffer);
const zBuf = new Float32Array(RW);

const $ = id => document.getElementById(id);
const overlay = $('overlay'), msgEl = $('msg'), hpfill = $('hpfill'), stats = $('stats'), introEl = $('intro');
const introCanvas = $('intro3d'), capEl = $('caption'), flashEl = $('flash');
const isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;

const rnd = (a, b) => a + Math.random() * (b - a);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toPixels(c) {
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const out = new Uint32Array(c.width * c.height);
  for (let i = 0, j = 0; i < out.length; i++, j += 4)
    out[i] = (d[j] | (d[j + 1] << 8) | (d[j + 2] << 16) | (d[j + 3] << 24)) >>> 0;
  return out;
}

// ---------- procedural textures ----------
function makeWall(hue, sat, light, mortar, bw, bh) {
  const c = mk(64, 64), g = c.getContext('2d');
  g.fillStyle = mortar; g.fillRect(0, 0, 64, 64);
  for (let y = 0, row = 0; y < 64; y += bh, row++) {
    const off = row % 2 ? bw / 2 : 0;
    for (let x = -bw; x < 64; x += bw) {
      g.fillStyle = `hsl(${hue + rnd(-4, 4)},${sat + rnd(-5, 5)}%,${light + rnd(-6, 6)}%)`;
      g.fillRect(x + off + 1, y + 1, bw - 2, bh - 2);
    }
  }
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(0,0,0,${rnd(0, 0.22)})`;
    g.fillRect(rnd(0, 62), rnd(0, 62), 2, 2);
  }
  return toPixels(c);
}
function doorTex() {
  const c = mk(64, 64), g = c.getContext('2d');
  g.fillStyle = '#4a2b15'; g.fillRect(0, 0, 64, 64);
  for (let x = 0; x < 64; x += 8) {
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, 0, 1, 64);
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x + 2, 0, 2, 64);
  }
  g.fillStyle = '#2a2a30'; g.fillRect(0, 14, 64, 3); g.fillRect(0, 40, 64, 3);
  g.fillStyle = '#c9a227'; g.fillRect(0, 0, 64, 2); g.fillRect(0, 0, 2, 64); g.fillRect(62, 0, 2, 64);
  g.beginPath(); g.arc(32, 27, 4, 0, Math.PI * 2); g.fill();
  return toPixels(c);
}
function monsterTex(body, horns) {
  const c = mk(32, 32), g = c.getContext('2d');
  if (horns) {
    g.fillStyle = '#e8e0c8';
    g.beginPath(); g.moveTo(8, 9); g.lineTo(5, 1); g.lineTo(12, 7); g.fill();
    g.beginPath(); g.moveTo(24, 9); g.lineTo(27, 1); g.lineTo(20, 7); g.fill();
  }
  g.fillStyle = body; g.beginPath(); g.ellipse(16, 14, 9, 10, 0, 0, Math.PI * 2); g.fill();
  g.fillRect(9, 22, 5, 8); g.fillRect(18, 22, 5, 8);
  g.fillStyle = '#000'; g.fillRect(10, 12, 4, 4); g.fillRect(18, 12, 4, 4);
  g.fillStyle = '#f22'; g.fillRect(11, 13, 2, 2); g.fillRect(19, 13, 2, 2);
  g.fillStyle = '#300'; g.fillRect(12, 20, 8, 2);
  return toPixels(c);
}
// ---- placeholder monster sprites (32x32, drawn by hand) ----
function ratTex() {
  const c = mk(32, 32), g = c.getContext('2d');
  g.strokeStyle = '#7d5f5f'; g.lineWidth = 1.5;               // tail hanging down behind
  g.beginPath(); g.moveTo(16, 29); g.quadraticCurveTo(29, 30, 27, 17); g.stroke();
  g.fillStyle = '#4a3a3a'; g.fillRect(9, 25, 3, 5); g.fillRect(20, 25, 3, 5);   // feet
  g.fillStyle = '#6e5a58'; g.beginPath(); g.ellipse(16, 21, 9, 7, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#8f7a76'; g.beginPath(); g.ellipse(16, 22, 5, 3, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#6e5a58';
  g.beginPath(); g.arc(9, 9, 3.5, 0, Math.PI * 2); g.arc(23, 9, 3.5, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#c98a84';
  g.beginPath(); g.arc(9, 9, 1.8, 0, Math.PI * 2); g.arc(23, 9, 1.8, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#6e5a58'; g.beginPath(); g.ellipse(16, 14, 7, 6, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#7e6a68'; g.beginPath(); g.ellipse(16, 18, 3, 2, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f22'; g.fillRect(12, 12, 2, 2); g.fillRect(18, 12, 2, 2);
  g.fillStyle = '#000'; g.fillRect(15, 17, 2, 1);
  g.fillStyle = '#f0ecd8'; g.fillRect(15, 19, 1, 2); g.fillRect(16, 19, 1, 2);   // big front teeth
  return toPixels(c);
}
function flameTex() {
  // a fireball with a face: flickering tongues on top, glowing core, angry eyes, jagged mouth
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#ff7a1a';
  g.beginPath(); g.moveTo(6, 16); g.lineTo(9, 4); g.lineTo(12, 13); g.lineTo(16, 1); g.lineTo(20, 13); g.lineTo(23, 4); g.lineTo(26, 16); g.closePath(); g.fill();
  const grd = g.createRadialGradient(16, 18, 2, 16, 18, 13);
  grd.addColorStop(0, '#fff7a0'); grd.addColorStop(0.55, '#ff8a20'); grd.addColorStop(1, 'rgba(255,60,0,0.6)');
  g.fillStyle = grd; g.beginPath(); g.ellipse(16, 18, 11, 11, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3a0800'; g.fillRect(9, 13, 5, 1); g.fillRect(18, 13, 5, 1);   // brows
  g.fillRect(10, 15, 3, 4); g.fillRect(19, 15, 3, 4);                          // eyes
  g.fillStyle = '#fff7a0'; g.fillRect(11, 16, 1, 1); g.fillRect(20, 16, 1, 1); // glints
  g.fillStyle = '#3a0800';
  g.beginPath(); g.moveTo(11, 23); g.lineTo(21, 23); g.lineTo(19, 26); g.lineTo(16, 24); g.lineTo(13, 26); g.closePath(); g.fill();
  return toPixels(c);
}
function demonTex() {
  // Doom-style imp: hunched, bone horns, spined shoulders, clawed arms, glowing yellow eyes
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#d9d0b4';
  g.beginPath(); g.moveTo(9, 9); g.lineTo(6, 1); g.lineTo(13, 7); g.fill();
  g.beginPath(); g.moveTo(23, 9); g.lineTo(26, 1); g.lineTo(19, 7); g.fill();
  g.fillStyle = '#4a2010';
  g.beginPath(); g.moveTo(6, 12); g.lineTo(1, 9); g.lineTo(7, 16); g.fill();
  g.beginPath(); g.moveTo(26, 12); g.lineTo(31, 9); g.lineTo(25, 16); g.fill();
  g.fillStyle = '#7a3520'; g.beginPath(); g.ellipse(16, 16, 10, 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#8a4028'; g.fillRect(4, 16, 4, 11); g.fillRect(24, 16, 4, 11);
  g.fillStyle = '#e8e0c8'; g.fillRect(3, 27, 2, 3); g.fillRect(5, 27, 2, 3); g.fillRect(25, 27, 2, 3); g.fillRect(27, 27, 2, 3);
  g.fillStyle = '#4a2010'; g.fillRect(9, 23, 5, 8); g.fillRect(18, 23, 5, 8);
  g.fillStyle = '#ffd21a'; g.fillRect(10, 11, 4, 3); g.fillRect(18, 11, 4, 3);
  g.fillStyle = '#1a0500'; g.fillRect(12, 20, 8, 3);
  g.fillStyle = '#f0e8d0'; g.fillRect(13, 20, 1, 2); g.fillRect(15, 20, 1, 2); g.fillRect(17, 20, 1, 2); g.fillRect(19, 20, 1, 2);
  return toPixels(c);
}
function angelTex() {
  // winged figure in a white robe with a gold halo, Megami Tensei-style
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#e8ecf4';
  g.beginPath(); g.moveTo(12, 14); g.lineTo(1, 3); g.lineTo(2, 9); g.lineTo(0, 14); g.lineTo(4, 20); g.lineTo(10, 22); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(20, 14); g.lineTo(31, 3); g.lineTo(30, 9); g.lineTo(32, 14); g.lineTo(28, 20); g.lineTo(22, 22); g.closePath(); g.fill();
  g.fillStyle = '#b8c2d6';
  g.beginPath(); g.moveTo(10, 16); g.lineTo(3, 11); g.lineTo(6, 19); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(22, 16); g.lineTo(29, 11); g.lineTo(26, 19); g.closePath(); g.fill();
  g.strokeStyle = '#ffe27a'; g.lineWidth = 1; g.beginPath(); g.ellipse(16, 3, 6, 2, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#f4f1e6'; g.beginPath(); g.moveTo(12, 12); g.lineTo(20, 12); g.lineTo(23, 30); g.lineTo(9, 30); g.closePath(); g.fill();
  g.fillStyle = '#c9a227'; g.fillRect(15, 12, 2, 18);
  g.fillStyle = '#f0d2b0'; g.beginPath(); g.arc(16, 9, 4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#d8c9a8'; g.fillRect(12, 5, 8, 2);
  g.fillStyle = '#4aa8ff'; g.fillRect(14, 9, 1, 1); g.fillRect(17, 9, 1, 1);
  g.fillStyle = '#f0d2b0'; g.fillRect(9, 14, 2, 8); g.fillRect(21, 14, 2, 8);
  return toPixels(c);
}
function potionTex() {
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#bbb'; g.fillRect(13, 4, 6, 5);
  g.fillStyle = '#8a5a2b'; g.fillRect(12, 2, 8, 3);
  g.fillStyle = '#d12c2c'; g.beginPath(); g.arc(16, 21, 8, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(12, 18, 2, 5);
  return toPixels(c);
}
function crateTex() {
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#7a4e22'; g.fillRect(4, 8, 24, 20);
  g.fillStyle = '#4a2e12'; g.fillRect(4, 8, 24, 2); g.fillRect(4, 26, 24, 2);
  g.fillStyle = '#e0b737'; g.fillRect(4, 15, 24, 2);
  g.fillStyle = '#ffe27a'; g.fillRect(14, 12, 4, 4);
  return toPixels(c);
}
function ammoTex() {
  const c = mk(32, 32), g = c.getContext('2d');
  for (let i = 0; i < 3; i++) {
    g.fillStyle = '#c0c4cc'; g.fillRect(6 + i * 7, 10, 4, 14);
    g.fillStyle = '#c99a2a'; g.fillRect(6 + i * 7, 10, 4, 4);
  }
  return toPixels(c);
}
function arrowTex() {
  // a bolt flying away from the player: shaft stands upright, steel point at the top, red fletching at the back
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#c8a878'; g.fillRect(15, 9, 2, 20);                 // wooden shaft
  g.fillStyle = '#e0c8a0'; g.fillRect(15, 9, 1, 20);                 // lit edge
  g.fillStyle = '#d8d8e0';
  g.beginPath(); g.moveTo(16, 1); g.lineTo(20, 9); g.lineTo(12, 9); g.closePath(); g.fill();   // steel head
  g.fillStyle = '#a8a8b0'; g.fillRect(15, 3, 1, 6);                  // head shading
  g.fillStyle = '#d33';
  g.beginPath(); g.moveTo(15, 22); g.lineTo(8, 30); g.lineTo(15, 27); g.closePath(); g.fill();   // left fletching
  g.beginPath(); g.moveTo(17, 22); g.lineTo(24, 30); g.lineTo(17, 27); g.closePath(); g.fill();  // right fletching
  return toPixels(c);
}
function magicTex() {
  const c = mk(32, 32), g = c.getContext('2d');
  const grd = g.createRadialGradient(16, 16, 1, 16, 16, 15);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.4, '#c060ff'); grd.addColorStop(1, 'rgba(120,0,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 32, 32);
  return toPixels(c);
}
function stairsTex() {
  // a flight seen head-on: each step is a band across the view, the far steps higher and narrower
  const c = mk(32, 32), g = c.getContext('2d');
  g.fillStyle = '#1a1714'; g.fillRect(6, 6, 20, 26);          // dark stairwell behind the steps
  for (let i = 0; i < 5; i++) {

function generate(lv) {

  for (let tries = 0; tries < 300 && rooms.length < target; tries++) {
    const w = 4 + ((Math.random() * 5) | 0), h = 4 + ((Math.random() * 5) | 0);
    const x0 = 1 + ((Math.random() * (W - w - 2)) | 0), y0 = 1 + ((Math.random() * (H - h - 2)) | 0);

  }

  for (const r of rooms) {

    if (w >= 7 && h >= 7 && Math.random() < 0.6) {
